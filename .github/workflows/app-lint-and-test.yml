name: app - lint and test

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "packages/wallet/**"
      - "packages/cashweb/**"
      - "packages/bot/**"
      - "packages/bot-framework/**"
      - "packages/bitcore-lib-xpi/**"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/app-lint-and-test.yml"
  pull_request:
    paths:
      - "app/**"
      - "packages/wallet/**"
      - "packages/cashweb/**"
      - "packages/bot/**"
      - "packages/bot-framework/**"
      - "packages/bitcore-lib-xpi/**"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/app-lint-and-test.yml"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: "26"
      - run: yarn install
      - run: yarn lint
      - run: yarn test:unit:ci

  wallet-monad-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: "26"
      - run: yarn install
      # Every name below must be a file that exists: jest treats a name as a filter, so a
      # stale one runs nothing and the job stays green (`ci-payment-suites.jest.test.ts` checks).
      - name: Wallet EVM-chain regression
        run: yarn workspace @frank/wallet test --ci --runInBand chain/evm-chain.jest.test.ts chain/evm-parallel-send.jest.test.ts chain/outgoing-message-store.jest.test.ts storage/outgoing-message-store-boundary.jest.test.ts chain/evm-recorded-funding-recovery.jest.test.ts chain/evm-shared-canonical-callers.jest.test.ts evm-transaction-set-preparer.jest.test.ts evm-transaction-set-reservations.jest.test.ts evm-wallet-coin-list.jest.test.ts topic-clients.jest.test.ts chain/canonical-dm-message-id.jest.test.ts chain/evm-contract-call-composition.jest.test.ts evm-spend-spacing.jest.test.ts evm-stamp-client.jest.test.ts storage/stamp-attempt-journal.jest.test.ts level-declaration.jest.test.ts ci-payment-suites.jest.test.ts
      - name: Durable native operation and canonical inclusion regression
        run: yarn workspace @frank/wallet test --ci --runInBand storage/evm-native-operation-journal.jest.test.ts chain/evm-legacy-consolidator.jest.test.ts chain/evm-contract-call.jest.test.ts chain/native-reserve-support.jest.test.ts
      # The same sends against a real EVM node (anvil, from the @foundry-rs/anvil package the
      # contracts workspace installs). The step fails if the binary is missing, so the suite
      # can never be silently skipped here.
      - name: Parallel sends on a real EVM node (anvil)
        run: |
          ANVIL_BIN="$(find node_modules packages/*/node_modules -path '*@foundry-rs/anvil-linux-*' -name anvil -type f 2>/dev/null | head -1)"
          test -x "$ANVIL_BIN" || { echo "no anvil binary under node_modules/@foundry-rs" >&2; exit 1; }
          ANVIL_BIN="$ANVIL_BIN" yarn workspace @frank/wallet test --ci --runInBand chain/evm-parallel-send.anvil.jest.test.ts

  bot-demo-suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: "26"
      - run: yarn install
      # Unit suites only: the launcher's own suites (demo/) and the bot host's. The demo's real
      # checks (`yarn test:two-wallets`, `yarn demo:smoke`) need the relay binary, a Monad testnet
      # RPC URL and funded testnet wallets, which this job does not have; they are not run here,
      # and nothing here stands in for them.
      - name: Bot launcher and host unit suites
        run: yarn workspace @frank/bot test --ci --runInBand demo/ qwen-host-safety.jest.test.ts qwen-reply.jest.test.ts bot-state-dir.jest.test.ts src/bots/qwen-bot.jest.test.ts src/bots/blackjack-host.jest.test.ts qwen-bot-common.jest.test.ts bot-entry-import.jest.test.ts src/bots/faucet-bot.jest.test.ts ci-bot-suites.jest.test.ts

      - name: Bot host and durable faucet recovery regression
        run: yarn workspace @frank/bot-framework test --ci --runInBand

  cashweb-message-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: "26"
      - run: yarn install
      - name: Cashweb message-store regressions
        run: yarn workspace @frank/cashweb test --ci --runInBand relay/storage/level-storage.jest.test.ts
