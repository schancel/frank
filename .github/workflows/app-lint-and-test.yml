name: app - lint and test

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "packages/wallet/**"
      - "packages/cashweb/**"
      - ".github/workflows/app-lint-and-test.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "packages/wallet/**"
      - "packages/cashweb/**"
      - ".github/workflows/app-lint-and-test.yml"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: "26"
      - run: yarn install
      - run: yarn lint
      - run: yarn test:unit:ci
      - name: Wallet Monad-chain regression
        run: yarn --cwd .. workspace @frank/wallet test --ci --runInBand chain/monad-chain.jest.test.ts
