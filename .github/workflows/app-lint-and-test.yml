name: app - lint and test

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "packages/wallet/**"
      - "packages/contracts/**"
      - "packages/cashweb/**"
      - "packages/bot/**"
      - "packages/bot-framework/**"
      - "packages/bitcore-lib-xpi/**"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/app-lint-and-test.yml"
  pull_request:
    paths:
      - "app/**"
      - "packages/wallet/**"
      - "packages/contracts/**"
      - "packages/cashweb/**"
      - "packages/bot/**"
      - "packages/bot-framework/**"
      - "packages/bitcore-lib-xpi/**"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/app-lint-and-test.yml"
  # Run by hand, for example on a main commit the path filters skipped.
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: "26"
      - run: yarn install
      - run: yarn lint
      - run: yarn test:unit:ci

  wallet-monad-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: "26"
      - run: yarn install
      # Every name below must be a file that exists: jest treats a name as a filter, so a
      # stale one runs nothing and the job stays green (`ci-payment-suites.jest.test.ts` checks).
      - name: Wallet EVM-chain regression
        run: yarn workspace @frank/wallet test --ci --runInBand chain/evm-chain.jest.test.ts chain/evm-parallel-send.jest.test.ts chain/outgoing-message-store.jest.test.ts storage/outgoing-message-store-boundary.jest.test.ts chain/evm-recorded-funding-recovery.jest.test.ts chain/evm-shared-canonical-callers.jest.test.ts evm-transaction-set-preparer.jest.test.ts evm-transaction-set-reservations.jest.test.ts evm-wallet-coin-list.jest.test.ts topic-clients.jest.test.ts chain/canonical-dm-message-id.jest.test.ts chain/evm-contract-call-composition.jest.test.ts evm-spend-spacing.jest.test.ts evm-stamp-client.jest.test.ts storage/stamp-attempt-journal.jest.test.ts level-declaration.jest.test.ts ci-payment-suites.jest.test.ts wallet-failure.jest.test.ts wallet-failure-boundary.jest.test.ts evm-rpc-failure.jest.test.ts evm-provider-response-failure.jest.test.ts evm-provider.jest.test.ts evm-transaction-set-runtime.jest.test.ts evm-spend-rule-head.jest.test.ts utxo-wallet.jest.test.ts
      - name: Durable native operation and canonical inclusion regression
        run: yarn workspace @frank/wallet test --ci --runInBand storage/evm-native-operation-journal.jest.test.ts chain/evm-legacy-consolidator.jest.test.ts chain/evm-contract-call.jest.test.ts chain/native-reserve-support.jest.test.ts evm-transaction-set-submission.jest.test.ts chain/evm-refused-resign.jest.test.ts
      # Typed wallet custody and owned balance, the user's reconcile pass, blackjack hands and
      # escrow payouts between two typed wallets, and the message-item registry and text limits.
      - name: Wallet custody, reconcile, blackjack and message-item regression
        run: yarn workspace @frank/wallet test --ci --runInBand chain/evm-domain-wallet.jest.test.ts chain/evm-wallet-reconcile.jest.test.ts chain/evm-chain-blackjack.jest.test.ts chain/evm-chain-blackjack-escrow.jest.test.ts message-item-plugins/default-registry.jest.test.ts message-item-plugins/text/long-text.jest.test.ts
      # The same sends against a real EVM node (anvil, from the @foundry-rs/anvil package the
      # contracts workspace installs). The step fails if the binary is missing, so the suite
      # can never be silently skipped here.
      - name: Parallel sends on a real EVM node (anvil)
        run: |
          ANVIL_BIN="$(find node_modules packages/*/node_modules -path '*@foundry-rs/anvil-linux-*' -name anvil -type f 2>/dev/null | head -1)"
          test -x "$ANVIL_BIN" || { echo "no anvil binary under node_modules/@foundry-rs" >&2; exit 1; }
          ANVIL_BIN="$ANVIL_BIN" yarn workspace @frank/wallet test --ci --runInBand chain/evm-parallel-send.anvil.jest.test.ts
      # A stealth payment and its stamp stay within the fee the user approved, on a real node.
      - name: Stealth payment fee bound on a real EVM node (anvil)
        run: |
          ANVIL_BIN="$(find node_modules packages/*/node_modules -path '*@foundry-rs/anvil-linux-*' -name anvil -type f 2>/dev/null | head -1)"
          test -x "$ANVIL_BIN" || { echo "no anvil binary under node_modules/@foundry-rs" >&2; exit 1; }
          # Absolute: the suite runs from the package directory.
          ANVIL_BIN="$PWD/$ANVIL_BIN" yarn workspace @frank/wallet test --ci --runInBand chain/evm-stealth-fee-bound.anvil.jest.test.ts

  # Payments between two wallets on a real EVM node (anvil): carried payments reach the node only
  # after the relay stores their message, released payments never do, and what each side counts
  # is what the chain holds. Its own job, beside wallet-monad-chain, so it does not lengthen it.
  wallet-received-payments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: "26"
      - run: yarn install
      - name: Received payments on a real EVM node (anvil)
        run: |
          ANVIL_BIN="$(find node_modules packages/*/node_modules -path '*@foundry-rs/anvil-linux-*' -name anvil -type f 2>/dev/null | head -1)"
          test -x "$ANVIL_BIN" || { echo "no anvil binary under node_modules/@foundry-rs" >&2; exit 1; }
          # Absolute: the suite runs from the package directory.
          ANVIL_BIN="$PWD/$ANVIL_BIN" yarn workspace @frank/wallet test --ci --runInBand --testMatch '<rootDir>/chain/received-payments.anvil.integration.ts'
      # Deposits from outside Frank, found by reading the node: History's "Received from 0x…".
      - name: Deposits from outside Frank on a real EVM node (anvil)
        run: |
          ANVIL_BIN="$(find node_modules packages/*/node_modules -path '*@foundry-rs/anvil-linux-*' -name anvil -type f 2>/dev/null | head -1)"
          test -x "$ANVIL_BIN" || { echo "no anvil binary under node_modules/@foundry-rs" >&2; exit 1; }
          ANVIL_BIN="$PWD/$ANVIL_BIN" yarn workspace @frank/wallet test --ci --runInBand evm-deposit-scan.anvil.jest.test.ts

  # GenericHTLC and StateChannel on a real EVM node (anvil), and the wallet's HTLC encoders,
  # reader, game escrow and table buy-in escrow against the compiled artifact. The step fails
  # if the binary is missing, so no anvil suite can be silently skipped here.
  contracts-and-htlc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: "26"
      - run: yarn install
      - name: Contracts and wallet HTLC suites on a real EVM node (anvil)
        run: |
          ANVIL_BIN="$(find node_modules packages/*/node_modules -path '*@foundry-rs/anvil-linux-*' -name anvil -type f 2>/dev/null | head -1)"
          test -x "$ANVIL_BIN" || { echo "no anvil binary under node_modules/@foundry-rs" >&2; exit 1; }
          export ANVIL_BIN="$PWD/$ANVIL_BIN"
          yarn workspace @frank/contracts test --ci --runInBand
          yarn workspace @frank/wallet test --ci --runInBand swap-escrow.jest.test.ts swap-escrow.anvil.jest.test.ts game-escrow.jest.test.ts table-escrow.anvil.jest.test.ts table-join.jest.test.ts table-preimage.jest.test.ts

  # Poker and liar's dice buy-ins held in GenericHTLC on a real EVM node (anvil): real player
  # wallets and the real table bots lock, join, play, pay out and refund. Its own job, beside
  # contracts-and-htlc, so its minute of anvil play does not lengthen that one. The step fails
  # if the binary is missing, so neither suite can be silently skipped here.
  bot-table-escrow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: "26"
      - run: yarn install
      - name: Table buy-in escrow bots on a real EVM node (anvil)
        run: |
          ANVIL_BIN="$(find node_modules packages/*/node_modules -path '*@foundry-rs/anvil-linux-*' -name anvil -type f 2>/dev/null | head -1)"
          test -x "$ANVIL_BIN" || { echo "no anvil binary under node_modules/@foundry-rs" >&2; exit 1; }
          ANVIL_BIN="$PWD/$ANVIL_BIN" yarn workspace @frank/bot test --ci --runInBand src/bots/table-htlc.anvil.jest.test.ts src/bots/table-join.anvil.jest.test.ts

  # Its own job, so it runs beside wallet-monad-chain instead of lengthening it. Its budgets are
  # counted work and CPU time, not wall-clock latency, so a busy shared runner does not fail it.
  wallet-budgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: "26"
      - run: yarn install
      - name: Wallet CPU and request budgets
        run: yarn workspace @frank/wallet test --ci --runInBand wallet-performance-simulation.integration.jest.test.ts

  bot-demo-suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: "26"
      - run: yarn install
      # Unit suites only: the launcher's own suites (demo/) and the bot host's. The demo's real
      # checks (`yarn test:two-wallets`, `yarn demo:smoke`) need the relay binary, a Monad testnet
      # RPC URL and funded testnet wallets, which this job does not have; they are not run here,
      # and nothing here stands in for them.
      - name: Bot launcher and host unit suites
        run: yarn workspace @frank/bot test --ci --runInBand demo/ qwen-host-safety.jest.test.ts qwen-reply.jest.test.ts bot-state-dir.jest.test.ts src/bots/qwen-bot.jest.test.ts src/bots/blackjack-host.jest.test.ts qwen-bot-common.jest.test.ts bot-entry-import.jest.test.ts src/bots/faucet-bot.jest.test.ts ci-bot-suites.jest.test.ts

      - name: Bot host and durable faucet recovery regression
        run: yarn workspace @frank/bot-framework test --ci --runInBand

  cashweb-message-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: "26"
      - run: yarn install
      - name: Cashweb message-store regressions
        run: yarn workspace @frank/cashweb test --ci --runInBand relay/storage/level-storage.jest.test.ts
      - name: Cashweb has no wallet dependency
        run: yarn workspace @frank/cashweb test --ci --runInBand wallet-dependency-boundary.jest.test.ts
