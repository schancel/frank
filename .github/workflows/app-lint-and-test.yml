name: app - lint and test

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "packages/wallet/**"
      - "packages/cashweb/**"
      - "packages/bot/**"
      - "packages/bot-framework/**"
      - "packages/bitcore-lib-xpi/**"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/app-lint-and-test.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "packages/wallet/**"
      - "packages/cashweb/**"
      - "packages/bot/**"
      - "packages/bot-framework/**"
      - "packages/bitcore-lib-xpi/**"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/app-lint-and-test.yml"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: "26"
      - run: yarn install
      - run: yarn lint
      - run: yarn test:unit:ci

  wallet-monad-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: "26"
      - run: yarn install
      - name: Wallet Monad-chain regression
        run: yarn workspace @frank/wallet test --ci --runInBand chain/monad-chain.jest.test.ts chain/monad-canonical-link-store.jest.test.ts chain/monad-canonical-settle-rewrite.jest.test.ts monad-stamp-client.jest.test.ts storage/stamp-attempt-journal.jest.test.ts level-declaration.jest.test.ts

  bot-demo-suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: "26"
      - run: yarn install
      - name: Bot demo suites
        run: yarn workspace @frank/bot test --ci --runInBand demo/smoke.jest.test.ts demo/demo-funding.jest.test.ts qwen-host-safety.jest.test.ts qwen-bot-common.jest.test.ts

  cashweb-message-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: "26"
      - run: yarn install
      - name: Cashweb message-store regressions
        run: yarn workspace @frank/cashweb test --ci --runInBand relay/storage/level-storage.jest.test.ts
