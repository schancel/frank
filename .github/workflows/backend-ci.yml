name: backend - build and test

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

# NOTE: adapted from the pre-fork `cashweb` repo's own ci.yml, which checked out `cashweb` and
# `bitcoinsuite` as separate sibling repos. In this monorepo both are already vendored as
# `backend/cashweb` and `backend/bitcoinsuite` under one checkout, so those two checkout steps
# were removed and every working-directory / cache-key path below was updated to match. This has
# NOT yet been verified against a real CI run (no CI has actually executed on this repo before —
# see the sibling app-lint-and-test.yml's own history for why) - if the `cargo make`/flatbuffers
# steps fail, that verification is the next step, not a sign this file is fundamentally wrong.
jobs:
  ci-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Must come AFTER the main checkout: actions/checkout defaults to `clean: true`, which runs
    # `git clean -ffdx` in the workspace root and would delete this directory (as an untracked
    # file) if it were created first, causing every later `cp ... ../bin/` to fail with
    # "Not a directory".
    - name: Make bin directory
      run: |
        mkdir bin
        echo "$(pwd)/bin" >> $GITHUB_PATH
      shell: bash

    - name: Checkout cargo-make repository
      uses: actions/checkout@v4
      with:
        path: cargo-make
        repository: sagiegurari/cargo-make
        ref: 0.35.10

    - name: Checkout flatbuffers repository
      uses: actions/checkout@v4
      with:
        path: flatbuffers
        repository: google/flatbuffers
        # v2.0.0 fails to build on modern GCC (Ubuntu 24.04 runners ship GCC 13) due to a
        # -Werror=stringop-overflow false positive in reflection.cpp. v2.0.8 is the last patch
        # release on the 2.0.x branch (matches bitcoinsuite-bitcoind-nng's `flatbuffers = "2.0"`
        # Cargo requirement) and upstream already added `-Wno-error=stringop-overflow` there.
        ref: v2.0.8

    - name: Cache flatc
      uses: actions/cache@v4
      with:
        path: |
          flatbuffers/build
        key: ${{ runner.os }}-flatbuffers-ninja-v2.0.8
        restore-keys: |
          ${{ runner.os }}-flatbuffers-ninja-

    - name: Install Protoc
      uses: arduino/setup-protoc@v1
      with:
        # Without a token this calls the GitHub releases API unauthenticated (60 req/hr, shared
        # across the whole GitHub Actions runner IP pool) and was hitting "API rate limit
        # exceeded" during iteration on this workflow.
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install ninja
      uses: seanmiddleditch/gha-setup-ninja@master
      with:
        version: 1.10.2

    - name: Build flatc if not cached
      working-directory: ./flatbuffers
      run: |
        if [ ! -d "build" ]; then
          mkdir build
          cd build
          # Only build the flatc binary itself, not flatbuffers' own test suite (the default
          # "all" target) -- v2.0.8's flattests target fails to compile on GCC 13 due to a
          # missing #include <cstdint> in tests/reflection_test.h, an unrelated upstream test-only
          # bug we don't need to fix since we only consume the flatc binary here.
          cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Release ..
          ninja flatc
          cd ..
        fi
        cp ./build/flatc ../bin/
      shell: bash

    - name: Set-up Rust toolchain
      # actions-rs/toolchain is unmaintained (org archived, runs on the deprecated node12
      # runtime); dtolnay/rust-toolchain is the actively-maintained drop-in replacement.
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        components: rustfmt, clippy

    - name: Get Rust version for cache
      id: rust-version
      run: |
        echo "::set-output name=rust_version::$(rustc --version)"
      shell: bash

    - name: Cache Rust dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ./target
        key: ${{ runner.os }}-cargodeps-${{steps.rust-version.outputs.rust_version}}-${{ hashFiles('backend/bitcoinsuite/Cargo.lock') }}-${{ hashFiles('backend/cashweb/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargodeps-${{steps.rust-version.outputs.rust_version}}-${{ hashFiles('backend/bitcoinsuite/Cargo.lock') }}-
          ${{ runner.os }}-cargodeps-${{steps.rust-version.outputs.rust_version}}-
          ${{ runner.os }}-cargodeps-

    - name: Build and install cargo make
      working-directory: ./cargo-make
      run: |
        CARGO_TARGET_DIR=$(pwd)/../target cargo install --path . --target-dir $(pwd)/../target
      shell: bash

    - name: Make bitcoinsuite nng
      working-directory: ./backend/bitcoinsuite
      run: |
        cargo make --cwd bitcoinsuite-bitcoind-nng generate-fb

    - name: Make bitcoinsuite libraries & download nodes
      working-directory: ./backend/bitcoinsuite
      run: |
        CARGO_TARGET_DIR=$(pwd)/../../target cargo make

    - name: Check format cashweb libraries with rustfmt
      working-directory: ./backend/cashweb
      run: |
        cargo fmt --check

    - name: Lint cashweb libraries with clippy
      working-directory: ./backend/cashweb
      run: |
        cargo clippy

    - name: Make cashweb libraries
      working-directory: ./backend/cashweb
      run: |
        CARGO_TARGET_DIR=$(pwd)/../../target \
          BITCOINSUITE_BIN_DIR=$(pwd)/../bitcoinsuite/downloads \
          cargo make

    - name: Build cashwebd
      working-directory: ./backend/cashweb
      run: |
        CARGO_TARGET_DIR=$(pwd)/../../target \
          RUSTFLAGS="-D warnings" \
          cargo build -p cashwebd-exe --release
        cp ../../target/release/cashwebd-exe ../../bin/
