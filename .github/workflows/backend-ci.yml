name: backend - build and test

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "**/*.proto"
      - "**/*_pb.js"
      - "**/*_pb.d.ts"
      - "docs/protocol/check-protobuf-inventory.sh"
      - "docs/protocol/protobuf-inventory.snapshot"
      - "docs/protocol/oracle/seed.json"
      - "packages/price-feeds/src/historical/**"
      - "packages/price-feeds/scripts/build-oracle-seed.py"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "**/*.proto"
      - "**/*_pb.js"
      - "**/*_pb.d.ts"
      - "docs/protocol/check-protobuf-inventory.sh"
      - "docs/protocol/protobuf-inventory.snapshot"
      - "docs/protocol/oracle/seed.json"
      - "packages/price-feeds/src/historical/**"
      - "packages/price-feeds/scripts/build-oracle-seed.py"
      - ".github/workflows/backend-ci.yml"

# NOTE: adapted from the pre-fork `cashweb` repo's own ci.yml, which checked out `cashweb` and
# `bitcoinsuite` as separate sibling repos. In this monorepo both are already vendored as
# `backend/cashweb` and `backend/bitcoinsuite` under one checkout, so those two checkout steps
# were removed and every working-directory / cache-key path below was updated to match. This has
# NOT yet been verified against a real CI run (no CI has actually executed on this repo before —
# see the sibling app-lint-and-test.yml's own history for why) - if the `cargo make`/flatbuffers
# steps fail, that verification is the next step, not a sign this file is fundamentally wrong.
jobs:
  ci-check:
    runs-on: ubuntu-latest
    # librocksdb-sys@0.8.3+7.4.4 (pinned by the `rocksdb` wrapper crate's own `^0.8.0`
    # requirement -- bumping past 0.8.x would mean also bumping `rocksdb` itself, a much bigger,
    # riskier change than this hackathon's remaining time warrants) vendors RocksDB 7.4.4's C++
    # source, which fails to compile under Ubuntu 24.04's default GCC 13 with errors inside
    # data_block_hash_index.cc/.h that don't reproduce locally on macOS/Clang (verified: this
    # repo's own vendored header/source pair is internally consistent -- `kCollision` and
    # `hash_and_restart_pairs_` are declared exactly where and as the compiler says they aren't).
    # This is old vendored C++ vs. a newer compiler's stricter defaults, the same class of problem
    # already fixed for flatbuffers above by pinning a compatible version -- here the fix is
    # pinning an older, still-Ubuntu-24.04-supported compiler instead, since the Cargo dependency
    # itself can't move.
    env:
      CC: gcc-12
      CXX: g++-12
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node for directory integration tests
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Install frozen directory test dependencies
      run: |
        npm install --global yarn@1.22.22
        yarn install --frozen-lockfile --ignore-scripts
        node node_modules/typescript/bin/tsc -p packages/nakamoto/tsconfig.json
        node node_modules/typescript/bin/tsc -p packages/crypto-box/tsconfig.json

    - name: Install gcc-12 (see the job-level CC/CXX comment above)
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-12 g++-12
      shell: bash

    # Must come AFTER the main checkout: actions/checkout defaults to `clean: true`, which runs
    # `git clean -ffdx` in the workspace root and would delete this directory (as an untracked
    # file) if it were created first, causing every later `cp ... ../bin/` to fail with
    # "Not a directory".
    - name: Make bin directory
      run: |
        mkdir bin
        echo "$(pwd)/bin" >> $GITHUB_PATH
      shell: bash


    - name: Install Protoc
      uses: arduino/setup-protoc@v3
      with:
        version: "36.2"
        # Without a token this calls the GitHub releases API unauthenticated (60 req/hr, shared
        # across the whole GitHub Actions runner IP pool) and was hitting "API rate limit
        # exceeded" during iteration on this workflow.
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Check local relay compiler resolution and prebuilt bypass
      run: |
        node --test backend/cashweb/protoc-tool/resolve.test.cjs
        bash backend/cashweb/run-local-monad-overrides.test.sh
      shell: bash

    - name: Check protobuf source and generated-binding inventory
      run: ./docs/protocol/check-protobuf-inventory.sh --check
      shell: bash

    # The relay compiles docs/protocol/oracle/seed.json in; it is generated from the bundled
    # history under packages/price-feeds/src/historical and must not drift from it.
    - name: Check the oracle seed is what its generator gives
      run: python3 packages/price-feeds/scripts/build-oracle-seed.py --check
      shell: bash


    - name: Set up sccache
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

    - name: Set-up Rust toolchain
      # actions-rs/toolchain is unmaintained (org archived, runs on the deprecated node12
      # runtime); dtolnay/rust-toolchain is the actively-maintained drop-in replacement.
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        components: rustfmt, clippy

    - name: Restore compatible Cargo dependencies and build artifacts
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      continue-on-error: true
      with:
        cache-provider: github
        shared-key: frank-backend-cargo-v1-${{ runner.os }}-${{ runner.arch }}-rust-stable-${{ hashFiles('backend/**/Cargo.lock', 'backend/**/Cargo.toml') }}
        workspaces: |
          backend/bitcoinsuite -> ../../target
          backend/cashweb -> ../../target
        cache-targets: true
        cache-bin: false
        cache-workspace-crates: false
        cache-all-crates: false
        cache-on-failure: false
        save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    - name: Cache cargo-make binary
      id: cargo-make-cache
      uses: actions/cache@v4
      with:
        path: ~/.cargo/bin/cargo-make
        key: ${{ runner.os }}-cargo-make

    - name: Install cargo-make on cache miss
      if: steps.cargo-make-cache.outputs.cache-hit != 'true'
      # Was previously built from a pinned git checkout (sagiegurari/cargo-make @ 0.35.10), which
      # no longer compiles: its own source hits a hard-denied lint (`unused_mut`) that used to be
      # a warning under an older rustc. Installing from crates.io instead resolves a modern,
      # toolchain-compatible version automatically rather than needing this pin bumped by hand
      # every time the runner's Rust toolchain moves forward.
      run: |
        which cargo-make || cargo install cargo-make
      shell: bash

    # `cargo make` with no task name runs cargo-make's default `dev-test-flow`, which builds
    # AND tests every bitcoinsuite member. `build` (build only, still depends on `ensure-bitcoind`
    # for the ABC/BCH downloads cashweb-registry's own tests want) is the right task, not the
    # default test flow.
    - name: Make bitcoinsuite libraries & download nodes
      working-directory: ./backend/bitcoinsuite
      run: |
        CARGO_TARGET_DIR=$(pwd)/../../target cargo make build

    - name: Check format cashweb libraries with rustfmt
      working-directory: ./backend/cashweb
      run: |
        cargo fmt --check

    - name: Lint cashweb libraries with clippy
      working-directory: ./backend/cashweb
      run: |
        cargo clippy

    - name: Make cashweb libraries
      working-directory: ./backend/cashweb
      run: |
        CARGO_TARGET_DIR=$(pwd)/../../target \
          BITCOINSUITE_BIN_DIR=$(pwd)/../bitcoinsuite/downloads \
          cargo make

    # RUSTFLAGS="-D warnings" was inherited from the pre-fork upstream ci.yml and, per this
    # file's own header comment, was never actually validated against a real CI run before
    # tonight. It promotes every rustc warning workspace-wide to a hard error, including in the
    # large vendored `backend/bitcoinsuite` tree this repo doesn't actively maintain -- newer
    # rustc versions keep adding lints (hidden_glob_reexports, mismatched_lifetime_syntaxes, ...)
    # that surface an unbounded, ever-growing tail of failures there as the toolchain moves
    # forward, unrelated to anything Frank's Monad port actually changed. `cargo clippy` (a
    # separate, more targeted step above) is the real lint gate; dropping `-D warnings` here only
    # removes a silently-broken strictness knob, not real verification -- plain `cargo build`
    # still fails on actual compile errors.
    - name: Build cashwebd
      working-directory: ./backend/cashweb
      run: |
        CARGO_TARGET_DIR=$(pwd)/../../target \
          cargo build -p cashwebd-exe --release
        cp ../../target/release/cashwebd-exe ../../bin/
