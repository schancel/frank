name: nakamoto

on:
  push:
    branches: [main, issue-236]
    paths:
      - "packages/nakamoto/**"
      - "packages/crypto-box/**"
      - ".github/workflows/nakamoto.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/nakamoto/**"
      - "packages/crypto-box/**"
      - ".github/workflows/nakamoto.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: "26"
      - run: yarn install --ignore-engines --frozen-lockfile
      - name: nakamoto
        working-directory: packages/nakamoto
        run: yarn test && yarn typecheck && yarn lint && yarn format
      - name: crypto-box
        working-directory: packages/crypto-box
        run: yarn test && yarn typecheck && yarn lint && yarn format
