name: nakamoto

on:
  push:
    branches: [main, issue-236]
    paths:
      - "packages/nakamoto/**"
      - "packages/crypto-box/**"
      - "packages/adaptor-signatures/**"
      - "packages/codex32/**"
      - "packages/domain-roots/**"
      - "packages/account-recovery/**"
      - "packages/swap-protocol/**"
      - "packages/cashweb/**"
      - "packages/wallet/**"
      - ".github/workflows/nakamoto.yml"
      - "yarn.lock"
  pull_request:
    branches: [main]
    paths:
      - "packages/nakamoto/**"
      - "packages/crypto-box/**"
      - "packages/adaptor-signatures/**"
      - "packages/codex32/**"
      - "packages/domain-roots/**"
      - "packages/account-recovery/**"
      - "packages/swap-protocol/**"
      - "packages/cashweb/**"
      - "packages/wallet/**"
      - ".github/workflows/nakamoto.yml"
      - "yarn.lock"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: "26"
      - run: yarn install --ignore-engines --frozen-lockfile
      - name: nakamoto
        working-directory: packages/nakamoto
        run: yarn test && yarn typecheck && yarn lint && yarn format && yarn check:shared && yarn check:deps && yarn check:bundle
      - name: crypto-box
        working-directory: packages/crypto-box
        run: yarn test && yarn typecheck && yarn lint && yarn format && yarn check:shared && yarn check:deps && yarn check:bundle
      - name: adaptor-signatures
        working-directory: packages/adaptor-signatures
        run: yarn test --runInBand && yarn typecheck && ../../node_modules/.bin/prettier --config ../../app/.prettierrc.json --check .
      - name: codex32
        working-directory: packages/codex32
        run: yarn test --runInBand && yarn typecheck && ../../node_modules/.bin/prettier --config ../../app/.prettierrc.json --check .
      - name: domain-roots
        working-directory: packages/domain-roots
        run: yarn test --runInBand && yarn typecheck && yarn check:vectors && ../../node_modules/.bin/prettier --config ../../app/.prettierrc.json --check .
      - name: account-recovery
        working-directory: packages/account-recovery
        run: yarn test --runInBand && yarn typecheck && ../../node_modules/.bin/prettier --config ../../app/.prettierrc.json --check .
      - name: swap-protocol
        working-directory: packages/swap-protocol
        run: yarn test --runInBand && yarn typecheck && ../../node_modules/.bin/prettier --config ../../app/.prettierrc.json --check .
      # Cashweb's jest config maps @frank/nakamoto to TypeScript source. This step
      # builds dist, typechecks the consumer against that declaration, and runs the
      # suite through a require() of dist. Node 26 can require the ESM build.
      # packages/cashweb has no typecheck script and tsc is already red on main
      # (untyped bluebird/level, protobuf values used as types). Fail only when
      # legacy-wallet/index.ts reports anything besides those bluebird diagnostics.
      - name: cashweb
        run: |
          yarn --cwd packages/nakamoto tsc -p tsconfig.json --pretty false
          test -s packages/nakamoto/dist/index.js
          test -s packages/nakamoto/dist/index.d.ts
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')
          const ts = require('typescript')
          const configPath = path.resolve('packages/cashweb/tsconfig.json')
          const read = ts.readConfigFile(configPath, ts.sys.readFile)
          if (read.error) throw new Error('cashweb tsconfig unreadable')
          const parsed = ts.parseJsonConfigFileContent(
            read.config,
            ts.sys,
            path.dirname(configPath),
          )
          const host = ts.createCompilerHost(parsed.options)
          const from = path.resolve('packages/cashweb/legacy-wallet/index.ts')
          const resolved = ts.resolveModuleName(
            '@frank/nakamoto',
            from,
            parsed.options,
            host,
          ).resolvedModule
          const file = resolved && resolved.resolvedFileName
          if (!file || !file.endsWith(`${path.sep}nakamoto${path.sep}dist${path.sep}index.d.ts`)) {
            console.error('cashweb resolved @frank/nakamoto to', file)
            process.exit(1)
          }
          console.log('cashweb @frank/nakamoto ->', file)
          const dist = path.resolve('packages/nakamoto/dist/index.js')
          const bridge = '/tmp/nakamoto-dist-bridge.cjs'
          const hit = '/tmp/nakamoto-dist-bridge.hit'
          fs.writeFileSync(
            bridge,
            `'use strict'\nrequire('fs').writeFileSync(${JSON.stringify(hit)}, '1')\nmodule.exports = require(${JSON.stringify(dist)})\n`,
          )
          const cfg = require('./packages/cashweb/jest.config.js')
          const mapped = cfg.moduleNameMapper['^@frank/nakamoto$']
          if (!mapped || !mapped.includes('nakamoto/src/index.ts')) {
            throw new Error('expected the jest source map so this step can replace it')
          }
          cfg.rootDir = path.resolve('packages/cashweb')
          cfg.moduleNameMapper['^@frank/nakamoto$'] = bridge
          fs.writeFileSync(
            '/tmp/cashweb-jest-built.cjs',
            'module.exports = ' + JSON.stringify(cfg, null, 2) + '\n',
          )
          try {
            fs.unlinkSync(hit)
          } catch (error) {
            if (error.code !== 'ENOENT') throw error
          }
          NODE
          tsc_log=/tmp/cashweb-tsc.txt
          set +e
          yarn --cwd packages/cashweb tsc -p tsconfig.json --pretty false --noEmit >"$tsc_log" 2>&1
          tsc_status=$?
          set -e
          cat "$tsc_log"
          if [ "$tsc_status" -ne 0 ] && ! grep -q "error TS" "$tsc_log"; then
            echo "cashweb tsc failed before diagnostics"
            exit "$tsc_status"
          fi
          CASHWEB_TSC_LOG="$tsc_log" node <<'NODE'
          const fs = require('fs')
          const text = fs.readFileSync(process.env.CASHWEB_TSC_LOG, 'utf8')
          const lines = text.split('\n').filter(line => line.startsWith('legacy-wallet/index.ts('))
          const allowed = line =>
            (line.includes('error TS7016:') && line.includes("module 'bluebird'")) ||
            (line.includes('error TS7006:') && /Parameter '(pkh|key)'/.test(line))
          const unexpected = lines.filter(line => !allowed(line))
          if (unexpected.length) {
            console.error('signing file failed to typecheck against the built package')
            for (const line of unexpected) console.error(line)
            process.exit(1)
          }
          console.log('cashweb signing file typecheck ok (' + lines.length + ' pre-existing bluebird diagnostics)')
          NODE
          yarn --cwd packages/cashweb jest --config /tmp/cashweb-jest-built.cjs --watchman=false
          test -s /tmp/nakamoto-dist-bridge.hit
          echo "cashweb jest loaded packages/nakamoto/dist/index.js"
      # Wallet's jest config maps @frank/nakamoto to TypeScript source. This step
      # typechecks monad-identity.ts against the built declarations and runs the
      # identity tests through a require() of dist. Other wallet files may already
      # fail tsc; only monad-identity.ts diagnostics fail this step.
      - name: wallet
        run: |
          test -s packages/nakamoto/dist/index.js
          test -s packages/nakamoto/dist/index.d.ts
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')
          const ts = require('typescript')
          const configPath = path.resolve('packages/wallet/tsconfig.json')
          const read = ts.readConfigFile(configPath, ts.sys.readFile)
          if (read.error) throw new Error('wallet tsconfig unreadable')
          const parsed = ts.parseJsonConfigFileContent(
            read.config,
            ts.sys,
            path.dirname(configPath),
          )
          const host = ts.createCompilerHost(parsed.options)
          const from = path.resolve('packages/wallet/monad-identity.ts')
          const resolved = ts.resolveModuleName(
            '@frank/nakamoto',
            from,
            parsed.options,
            host,
          ).resolvedModule
          const file = resolved && resolved.resolvedFileName
          if (!file || !file.endsWith(`${path.sep}nakamoto${path.sep}dist${path.sep}index.d.ts`)) {
            console.error('wallet resolved @frank/nakamoto to', file)
            process.exit(1)
          }
          console.log('wallet @frank/nakamoto ->', file)
          const dist = path.resolve('packages/nakamoto/dist/index.js')
          const bridge = '/tmp/nakamoto-wallet-dist-bridge.cjs'
          const hit = '/tmp/nakamoto-wallet-dist-bridge.hit'
          fs.writeFileSync(
            bridge,
            `'use strict'\nrequire('fs').writeFileSync(${JSON.stringify(hit)}, '1')\nmodule.exports = require(${JSON.stringify(dist)})\n`,
          )
          const cfg = require('./packages/wallet/jest.config.js')
          const mapped = cfg.moduleNameMapper['^@frank/nakamoto$']
          if (!mapped || !mapped.includes('nakamoto/src/index.ts')) {
            throw new Error('expected the jest source map so this step can replace it')
          }
          cfg.rootDir = path.resolve('packages/wallet')
          cfg.moduleNameMapper['^@frank/nakamoto$'] = bridge
          fs.writeFileSync(
            '/tmp/wallet-jest-built.cjs',
            'module.exports = ' + JSON.stringify(cfg, null, 2) + '\n',
          )
          try {
            fs.unlinkSync(hit)
          } catch (error) {
            if (error.code !== 'ENOENT') throw error
          }
          NODE
          tsc_log=/tmp/wallet-tsc.txt
          set +e
          yarn --cwd packages/wallet tsc -p tsconfig.json --pretty false --noEmit >"$tsc_log" 2>&1
          tsc_status=$?
          set -e
          cat "$tsc_log"
          if [ "$tsc_status" -ne 0 ] && ! grep -q "error TS" "$tsc_log"; then
            echo "wallet tsc failed before diagnostics"
            exit "$tsc_status"
          fi
          WALLET_TSC_LOG="$tsc_log" node <<'NODE'
          const fs = require('fs')
          const text = fs.readFileSync(process.env.WALLET_TSC_LOG, 'utf8')
          const lines = text.split('\n').filter(line => line.startsWith('monad-identity.ts('))
          if (lines.length) {
            console.error('monad-identity.ts failed to typecheck against the built package')
            for (const line of lines) console.error(line)
            process.exit(1)
          }
          console.log('wallet monad-identity.ts typecheck ok')
          NODE
          yarn --cwd packages/wallet jest --config /tmp/wallet-jest-built.cjs --watchman=false packages/wallet/monad-identity
          test -s /tmp/nakamoto-wallet-dist-bridge.hit
          echo "wallet jest loaded packages/nakamoto/dist/index.js"
