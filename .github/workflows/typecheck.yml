name: typecheck

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    name: TypeScript Verification (tsgo & tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Frank-CBOR type identifiers have one source, docs/protocol/message-types/v1.json; the TS and
      # Rust constants and the doc tables are generated from it and nothing else may define one.
      # It scans every tracked source file, so it runs here, where no path filter applies.
      - name: Check the message type identifiers are what their registry gives
        run: python3 docs/protocol/message-types/generate.py --check
        shell: bash
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "yarn"
      - name: Install dependencies
        run: yarn install --frozen-lockfile || yarn install
      - name: Build prerequisite package declarations
        run: |
          yarn --cwd packages/nakamoto tsc -p tsconfig.json --pretty false
          yarn --cwd packages/crypto-box tsc -p tsconfig.json --pretty false
      # Every Frank-CBOR vector corpus is the output of `yarn vectors:generate`
      # (docs/protocol/cbor/vectors/README.md); a hand edit or a stale corpus fails here.
      - name: Check the CBOR test vectors match their generators
        run: yarn vectors:check
      - name: Fast typecheck with native Go compiler (tsgo)
        run: yarn typecheck
      - name: Verify with standard TypeScript compiler (tsc)
        run: yarn typecheck:tsc
