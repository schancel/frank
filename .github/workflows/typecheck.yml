name: typecheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: TypeScript Verification (tsgo & tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "yarn"
      - name: Install dependencies
        run: yarn install --frozen-lockfile || yarn install
      - name: Build prerequisite package declarations
        run: |
          yarn --cwd packages/nakamoto tsc -p tsconfig.json --pretty false
          yarn --cwd packages/crypto-box tsc -p tsconfig.json --pretty false
      - name: Fast typecheck with native Go compiler (tsgo)
        run: yarn typecheck
      - name: Verify with standard TypeScript compiler (tsc)
        run: yarn typecheck:tsc
