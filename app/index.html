<!DOCTYPE html>
<html>
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8" />
    <meta name="description" content="<%= productDescription %>" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="128x128"
      href="icons/favicon-128x128.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="icons/favicon-96x96.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="icons/favicon-16x16.png"
    />
    <link rel="icon" type="image/ico" href="favicon.ico" />
    <link rel="manifest" href="manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="<%= productName %>" />
    <link rel="apple-touch-icon" href="icons/apple-icon-120x120.png" />
    <link
      rel="apple-touch-icon"
      sizes="152x152"
      href="icons/apple-icon-152x152.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="167x167"
      href="icons/apple-icon-167x167.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="icons/apple-icon-180x180.png"
    />

    <!-- Privacy protection (#486): UI fonts use local/system fallbacks without contacting
    third-party font CDNs (e.g. Google Fonts) on initial page load. -->
    <script>
      ;(function () {
        try {
          document.cookie =
            'ngrok-skip-browser-warning=1; path=/; max-age=31536000; SameSite=Lax'
          var origFetch = window.fetch
          if (origFetch) {
            window.fetch = function (input, init) {
              try {
                var opts = Object.assign({}, init)
                var h = new Headers(
                  opts.headers ||
                    (input instanceof Request ? input.headers : undefined) ||
                    {},
                )
                var url =
                  typeof input === 'string'
                    ? input
                    : input && input.url
                    ? input.url
                    : ''
                var isNgrok =
                  (url && url.includes('ngrok')) ||
                  (typeof location !== 'undefined' &&
                    location.hostname &&
                    location.hostname.includes('ngrok') &&
                    !url.startsWith('http'))
                if (isNgrok && !h.has('ngrok-skip-browser-warning')) {
                  h.set('ngrok-skip-browser-warning', '1')
                }
                opts.headers = h
                return origFetch.call(this, input, opts)
              } catch (e) {
                return origFetch.call(this, input, init)
              }
            }
          }
          var origOpen = XMLHttpRequest.prototype.open
          XMLHttpRequest.prototype.open = function (method, url) {
            this._reqUrl = url
            return origOpen.apply(this, arguments)
          }
          var origSend = XMLHttpRequest.prototype.send
          XMLHttpRequest.prototype.send = function () {
            try {
              var url = this._reqUrl || ''
              var isNgrok =
                (url && url.includes('ngrok')) ||
                (typeof location !== 'undefined' &&
                  location.hostname &&
                  location.hostname.includes('ngrok') &&
                  !url.startsWith('http'))
              if (isNgrok) {
                this.setRequestHeader('ngrok-skip-browser-warning', '1')
              }
            } catch (e) {}
            return origSend.apply(this, arguments)
          }
        } catch (e) {}
        try {
          if (
            typeof location !== 'undefined' &&
            typeof location.search === 'string' &&
            location.search.indexOf('extMode=popup') !== -1
          ) {
            document.documentElement.setAttribute('data-ext-mode', 'popup')
          }
        } catch (e) {}
      })()
    </script>
    <style>
      html[data-ext-mode='popup'],
      html[data-ext-mode='popup'] body {
        width: 400px;
        height: 600px;
        margin: 0;
        padding: 0;
      }
      #q-app:empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        width: 100%;
        box-sizing: border-box;
        background-color: var(--q-color-background, #faf6f3);
        background-image: linear-gradient(
          to bottom,
          #c8431e 0px,
          #c8431e 48px,
          transparent 48px
        );
      }
      body.body--dark #q-app:empty {
        background-color: var(--q-color-background, #121212);
      }
      #q-app:empty::before {
        content: '';
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 2.5px solid rgba(200, 67, 30, 0.2);
        border-top-color: #c8431e;
        animation: frank-boot-spin 0.75s linear infinite;
      }
      @keyframes frank-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #q-app:empty::before {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
