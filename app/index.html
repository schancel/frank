<!DOCTYPE html>
<html>
  <head>
    <title><%= typeof productName !== 'undefined' && productName ? productName : 'Signet' %></title>

    <meta charset="utf-8" />
    <meta name="description" content="<%= typeof productDescription !== 'undefined' && productDescription ? productDescription : 'A Monad powered internet cryptomessenger' %>" />
    <meta property="og:title" content="<%= typeof productName !== 'undefined' && productName ? productName : 'Signet' %>" />
    <meta property="og:description" content="<%= typeof productDescription !== 'undefined' && productDescription ? productDescription : 'A Monad powered internet cryptomessenger' %>" />
    <meta property="og:site_name" content="Signet" />
    <meta name="application-name" content="Signet" />
    <meta name="apple-mobile-web-app-title" content="Signet" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="128x128"
      href="icons/favicon-128x128.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="icons/favicon-96x96.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="icons/favicon-16x16.png"
    />
    <link rel="icon" type="image/ico" href="favicon.ico" />

    <!-- Privacy protection (#486): UI fonts use local/system fallbacks without contacting
    third-party font CDNs (e.g. Google Fonts) on initial page load. -->
    <script>
      ;(function () {
        try {
          document.cookie =
            'ngrok-skip-browser-warning=1; path=/; max-age=31536000; SameSite=Lax'
          var origFetch = window.fetch
          if (origFetch) {
            window.fetch = function (input, init) {
              try {
                var opts = Object.assign({}, init)
                var h = new Headers(
                  opts.headers ||
                    (input instanceof Request ? input.headers : undefined) ||
                    {},
                )
                if (!h.has('ngrok-skip-browser-warning')) {
                  h.set('ngrok-skip-browser-warning', '1')
                }
                opts.headers = h
                return origFetch.call(this, input, opts)
              } catch (e) {
                return origFetch.call(this, input, init)
              }
            }
          }
          var origSend = XMLHttpRequest.prototype.send
          XMLHttpRequest.prototype.send = function () {
            try {
              this.setRequestHeader('ngrok-skip-browser-warning', '1')
            } catch (e) {}
            return origSend.apply(this, arguments)
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
