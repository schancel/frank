# Plain static file serving is sufficient: `quasar.conf.js`'s `vueRouterMode` is `hash`, so
# routing lives entirely in the URL fragment (`#/chat/...`) and never reaches the server -- no SPA
# history-mode fallback (`try_files ... /index.html`) is needed.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    location / {
        try_files $uri $uri/ =404;
    }
}
