[package]
name = "cashweb-payload"
version = "0.1.0"
edition = "2021"

[dependencies]
bitcoinsuite-core = { path = "../../bitcoinsuite/bitcoinsuite-core" }
bitcoinsuite-error = { path = "../../bitcoinsuite/bitcoinsuite-error" }

# #[async_trait] macro, needed for the ChainAdapter trait
async-trait = "0.1.50"

# Hex en-/decoding
hex = "0.4"

# Protobuf (de)serialization
prost = "0.11"

# Derive error enums
thiserror = "1.0"

# Only for the mpsc::Receiver type used by ChainAdapter::subscribe_new_blocks
tokio = { version = "1.17", features = ["sync"] }

[build-dependencies]
# Build Protobuf structs
prost-build = "0.11"

[dev-dependencies]
bitcoinsuite-ecc-secp256k1 = { path = "../../bitcoinsuite/bitcoinsuite-ecc-secp256k1" }

# assert_eq! and assert_ne! with colored diffs
pretty_assertions = "1.2"
