[package]
name = "cashweb-pop-token"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bitcoinsuite-error = { path = "../../bitcoinsuite/bitcoinsuite-error" }

# #[async_trait] macro, needed for the PaymentVerifier trait
async-trait = "0.1.50"

# Base64 (de)coding of tokens
base64 = "0.13"

# HTTP header types, used for POP token extraction from `Authorization`
http = "0.2"

# HMAC-SHA256 bearer token construction/validation
hmac = "0.12"
sha2 = "0.10"

# Derive error enums
thiserror = "1.0"

[dev-dependencies]
# Async test harness for TokenIssuer/PaymentVerifier tests
tokio = { version = "1.17", features = ["macros", "rt"] }
