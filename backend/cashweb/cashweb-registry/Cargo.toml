[package]
name = "cashweb-registry"
version = "0.1.0"
edition = "2021"

[dependencies]
bitcoinsuite-core = { path = "../../bitcoinsuite/bitcoinsuite-core" }
bitcoinsuite-bitcoind = { path = "../../bitcoinsuite/bitcoinsuite-bitcoind" }
bitcoinsuite-error = { path = "../../bitcoinsuite/bitcoinsuite-error" }
bitcoinsuite-ecc-secp256k1 = { path = "../../bitcoinsuite/bitcoinsuite-ecc-secp256k1" }
bitcoinsuite-test-utils = { path = "../../bitcoinsuite/bitcoinsuite-test-utils" }
bitcoinsuite-test-utils-blockchain = { path = "../../bitcoinsuite/bitcoinsuite-test-utils-blockchain" }

cashweb-http-utils = { path = "../cashweb-http-utils" }
cashweb-payload = { path = "../cashweb-payload" }
# POP bearer-token extraction/issuance layer (ticket #22), wired into the registry-metadata-put
# path by ticket #24 (see `http/pop_protection.rs`).
cashweb-pop-token = { path = "../cashweb-pop-token" }
# `PopConf` (ticket #4): real config-file wiring for `http::pop_protection::PopGate`, replacing
# ticket #24's raw-env-var `OnceLock`. `cashweb-config` doesn't depend back on this crate, so this
# is a one-way edge, not a cycle.
cashweb-config = { path = "../cashweb-config" }

# #[async_trait] macro, needed to implement the ChainAdapter trait
async-trait = "0.1.50"

# Web app framework
axum = { version = "0.5", features = ["ws"] }

# Bloom filter for an approximate set
bloom = "0.3"

# Common library for anything futures related
futures = "0.3"

# Build JSON objects
json = "0.12"

# Protobuf (de)serialization
prost = "0.11"

# Random number generator
rand = "0.8"

# Simple HTTP client
reqwest = "0.11"

# Fast embedded key-value database
rocksdb = "0.19"

# For Deserialize
serde = { version = "1.0.147", features = ["derive"] }

# JSON (de)serialization for Monad's JSON-RPC-over-HTTPS transport (monad_http.rs)
serde_json = "1.0"

# Derive error enums
thiserror = "1.0"

# Async runtime
tokio = { version = "1.17", features = ["full"] }

# WS client, used by `monad_ws` to subscribe to Monad's `eth_subscribe("newHeads")` feed over
# Alchemy. Already present in the workspace lockfile (pulled in transitively by axum's "ws"
# feature); adding it directly here just adds the "native-tls" feature so we can dial `wss://`.
tokio-tungstenite = { version = "0.17", features = ["native-tls"] }

# HTTP Middleware
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.3.0", features = ["trace", "cors"] }

# Url parsing
url = { version = "2.2", features = ["serde"] }

# Hex en-/decoding
hex = "0.4"
tracing = "0.1.37"

# RLP decoding of a raw Monad (EVM-style) transaction (ticket #27): needed to reconstruct the
# transaction's signing preimage so its sender can be recovered via `ecrecover`. Nothing in this
# codebase implements RLP today (bitcoinsuite is Bitcoin/Lotus-shaped, not RLP/EVM); `rlp`
# (parity-common) is the de facto minimal, dependency-light RLP implementation in the Rust
# ecosystem, used here purely as a decoder/encoder for `monad_evm_tx.rs`'s own signing-preimage
# reconstruction -- it doesn't know anything about EVM transaction semantics itself.
rlp = "0.5"

# Keccak256 (ticket #27): Monad/EVM transactions are hashed (for both signing and address
# derivation) with Keccak256, not SHA256/SHA256d like the rest of this Bitcoin/Lotus-derived
# codebase. This is the *only* new primitive `monad_evm_tx.rs` needs -- the actual secp256k1 ECDSA
# recovery math reuses the already-present `bitcoinsuite_ecc_secp256k1::EccSecp256k1::recover_sig`
# (Ethereum's `ecrecover` is the same curve/signature scheme, just over a Keccak256 digest instead
# of a SHA256 one), so no new elliptic-curve crate (e.g. `k256`) is needed.
sha3 = "0.10"

[build-dependencies]
# Build Protobuf structs
prost-build = "0.11"

[dev-dependencies]
bitcoinsuite-ecc-secp256k1 = { path = "../../bitcoinsuite/bitcoinsuite-ecc-secp256k1" }

# assert_eq! and assert_ne! with colored diffs
pretty_assertions = "1.2"

# Temporary directories, automatically removed
tempdir = "0.3"
