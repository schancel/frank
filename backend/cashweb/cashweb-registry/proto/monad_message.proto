syntax = "proto3";
package cashweb.registry;

// One component of a direct-message stamp payment (ticket #60).
message MonadStampPayment {
  // Non-hardened child in the canonical m/44/145/<child_index>/0 derivation. The recipient and
  // relay independently derive the expected one-time EVM destination from this index, the
  // message payload hash, and the recipient's registered secp256k1 public key.
  uint32 child_index = 1;
  // Raw, signed, RLP-encoded Monad transaction paying this child's one-time destination. Its
  // calldata carries the domain-separated commitment derived from payload_hash and child_index.
  bytes raw_tx = 2;
}

// A Monad-native stamped direct message (tickets #27 and #60).
//
// The Lotus `SignedPayload`/`BurnTx` scheme (`cashweb-payload/proto/payload.proto`) is
// structurally UTXO-shaped -- `BurnTx.burn_idx` indexes into a Bitcoin-style transaction's output
// list, which has no EVM equivalent -- so a Monad stamp can't be carried through it. This message
// is a separate, simpler envelope for the Monad path instead (see this ticket's module docs for
// the full rationale, and PLAN.md constraint 5).
//
// The public envelope deliberately carries no sender-identity signature: direct-message sender
// authentication is recipient-verifiable inside the encrypted content, preserving deniability.
// Each payment transaction proves only that its distinct funding account authorized that payment.
message MonadStampedMessage {
  // Removed singular transaction field. This is an intentional, approved wire-format break; old
  // clients must not be silently interpreted as the new set form.
  reserved 1;
  reserved "raw_burn_tx";
  // The message payload, encrypted for its recipient(s). Opaque to the relay.
  bytes encrypted_payload = 2;
  // SHA256(encrypted_payload). Must match the actual hash of `encrypted_payload`; each payment's
  // calldata commits separately to this hash plus its child index.
  bytes payload_hash = 3;
  // One or more independently funded payments. Two is a sender-side privacy goal when available,
  // not a relay validity minimum; one correctly-derived payment is a valid fallback. Values need
  // not be equal, but their verified sum must meet the configured minimum.
  repeated MonadStampPayment stamp_payments = 4;
}

// A [`MonadStampedMessage`] as stored by the relay once its stamp verified, augmented with facts
// the relay itself derived (and that the client doesn't, and for the sender address cannot
// meaningfully, assert).
message StoredMonadMessage {
  // The original message as submitted.
  MonadStampedMessage message = 1;
  // Removed relay assertions from the old singular-payment design. Payment transaction hashes
  // are derived from each raw transaction when needed; no redundant hash list is serialized.
  reserved 2, 3;
  reserved "sender_address", "tx_hash";
  // Milliseconds since the Unix epoch when the relay stored this message.
  int64 timestamp = 4;
  // Frank-specific network tag (ticket #39, see PLAN.md constraint 9), e.g. `"MONT"`/`"MON1"` (see
  // `cashweb_registry::network_tag`), stamped by the relay from its own `FRANK_NETWORK_TAG`
  // configuration -- never asserted by the client, and never derived from a raw EVM `chainId`
  // (Lotus and any future non-EVM `ChainAdapter` have no such concept). Lets a client detect "the
  // relay I'm talking to is on a different network than I expect" once one relay deployment could
  // plausibly serve multiple chains. Empty (proto3 default) on records stored before this ticket
  // shipped -- deliberately not backfilled, and expected to decode fine as empty bytes.
  bytes network_tag = 5;
}

// Response for the authenticated recipient inbox `GET /message/monad/inbox/:recipient` (originally ticket #37's `GET /message/monad?since=<timestamp>`, removed in PR #197): a page of
// [`StoredMonadMessage`]s the relay has stored, ordered by `timestamp` ascending, letting a
// client discover newly-stored messages without already knowing their `payload_hash` out of
// band.
//
// NOTE on recipient addressing (see ticket #37's handoff for the full writeup): neither
// `MonadStampedMessage` nor `StoredMonadMessage` carries an intended-recipient field -- a Monad
// message is addressed purely by content hash, with `encrypted_payload` opaque to the relay.
// This endpoint therefore cannot filter server-side by recipient (unlike the polling endpoint
// shape ticket #37 sketches, the removed `GET /message/monad?since=<timestamp>&recipient=<address>`) --
// there is nothing in the wire format for the relay to filter *on*. A client must currently
// fetch this "since" page and determine which (if any) messages are addressed to it itself
// (e.g. by trial decryption), mirroring how `DbTopics`'s existing topic-broadcast model already
// works for the Lotus path (subscribers to a topic fetch everything and decrypt client-side).
// Adding real recipient filtering would need a new field on `MonadStampedMessage` (additive --
// e.g. `bytes recipient_address_hint = 4`, proto3 field addition is backward-compatible) but
// that's a wire-format decision left for deliberate review since #16/#19/#27/#30 all build on
// this proto -- not made unilaterally here.
message StoredMonadMessages {
  // Matching messages, ordered by `timestamp` ascending.
  repeated StoredMonadMessage messages = 1;
}
