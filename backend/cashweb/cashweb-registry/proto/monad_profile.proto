syntax = "proto3";
package cashweb.registry;

import "registry.proto";
import "payload.proto";

// MonadProfile is the Monad-native equivalent of AddressMetadata (ticket #45): user-specified
// profile content covered by the registrant's signature. Field-number-compatible with
// AddressMetadata (same shape, reusing AddressEntry directly, per this ticket's issue text) --
// kept as its own named message rather than literally reusing AddressMetadata, matching this
// crate's established "separate, Monad-specific proto for a Monad-specific route" precedent (see
// monad_message.proto's MonadStampedMessage, topic_message.proto's MonadTopicPost).
message MonadProfile {
    // Milliseconds since the Unix epoch. Must increase on every update to an already-registered
    // address (see `Registry::put_monad_profile`) -- mirrors AddressMetadata's identical
    // Lotus-side invariant, preventing a stale registration from being replayed.
    int64 timestamp = 1;
    // How long (in milliseconds) this profile should be considered valid for.
    int64 ttl = 2;
    // User-specified profile data (wallet-defined kind/headers/body entries).
    repeated AddressEntry entries = 3;
}

// One entry of ListMonadProfilesResponse (ticket #75). A SignedPayload doesn't carry its own
// owning address anywhere retrievable without the DB key it's stored under, so this pairs them
// explicitly -- mirrors registry.proto's GetMetadataRangeEntry (the Lotus-side equivalent), field
// for field.
message ListMonadProfilesEntry {
    // 0x-prefixed, EIP-55-checksummed 20-byte Monad address this profile is registered under.
    string address = 1;
    // The exact SignedPayload envelope as stored/returned by GET /metadata/monad/:addr -- not
    // re-wrapped, so a caller can verify it exactly as it would a single-address fetch.
    cashweb.payload.SignedPayload signed_payload = 2;
}

// Response for GET /metadata/monad?since=<timestamp> (ticket #75): every Monad profile
// registered at or after `since`, ordered by registration timestamp ascending. Lets a bot
// discover newly-registered identities by polling with an advancing cursor, mirroring
// StoredMonadMessages/GET /message/monad?since= (ticket #37)'s identical shape for messages.
message ListMonadProfilesResponse {
    // Profiles registered at or after the request's `since`, ordered by timestamp ascending.
    repeated ListMonadProfilesEntry entries = 1;
}
