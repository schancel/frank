syntax = "proto3";
package cashweb.registry;

// Monad-native topic post + burn-weighted vote (ticket #30).
//
// Mirrors `monad_message.proto`'s `MonadStampedMessage`/`StoredMonadMessage` pattern (ticket
// #27): no separate pubkey/signature field anywhere here either -- sender identity always comes
// from `ecrecover` over a message's `raw_burn_tx` (see `cashweb_registry::monad_evm_tx::
// recover_sender`), never an app-level signature.
//
// This extends that pattern with a Lotus-style *burn-weighted vote* (see `app/src/cashweb/
// registry/index.ts`'s `createBroadcast`/`addOfferings`/`calculateBurnAmount`): a topic post
// carries an initial up/down vote, and separate `MonadTopicVote` messages cast additional votes
// against an already-posted `payload_hash`. Unlike a plain Stamp burn (which only needs to prove
// "at least min_value_wei was burned"), a vote's exact burned value *is* its weight, and its
// calldata additionally carries an up/down direction -- see
// `cashweb_registry::monad_topic_verify`'s module docs for the exact calldata layout this
// implies and why it can't reuse `monad_stamp_verify::parse_commitment_calldata` as-is.

// A new topic post. `raw_burn_tx` doubles as this post's initial vote: its calldata must
// commit to `payload_hash` (this post's own content hash) via the `<lokad_id><version><direction>
// <commitment>` layout `monad_topic_verify` documents, exactly the way a plain
// `MonadStampedMessage`'s `raw_burn_tx` commits to its `payload_hash` -- just with an extra
// direction bit, since even a post's initial vote can be up or down.
message MonadTopicPost {
  // Topic this post belongs to (matches `BroadcastMessage.topic`'s intended use).
  string topic = 1;
  // SHA256 digest of the parent post this is replying to, if any. Empty (0 bytes) for a top-level
  // post -- proto3 has no separate "optional" needed here since 0-length is otherwise meaningless
  // for a hash.
  bytes parent_post_hash = 2;
  // Raw, signed, RLP-encoded Monad transaction burning value to the relay's configured topic-vote
  // burn address; its calldata commits to `payload_hash` and carries this post's initial vote
  // direction. The relay broadcasts this tx itself (mirroring `MonadStampedMessage.raw_burn_tx`)
  // -- the client is never required to have already landed it on-chain.
  bytes raw_burn_tx = 3;
  // The post's content, encrypted for its recipient(s) exactly like
  // `MonadStampedMessage.encrypted_payload`. Opaque to the relay.
  bytes encrypted_payload = 4;
  // SHA256(encrypted_payload). Must match both the actual hash of `encrypted_payload` and the
  // commitment carried in `raw_burn_tx`'s calldata.
  bytes payload_hash = 5;
}

// An additional vote cast against an already-posted `MonadTopicPost`, identified by its
// `target_payload_hash`. Carries no payload of its own (per the acceptance criteria: "target
// payload hash + raw burn tx, no new payload") -- it only exists to add more burn-weight to a
// post that's already stored.
message MonadTopicVote {
  // `payload_hash` of the `MonadTopicPost` this vote applies to. The post need not exist yet at
  // decode time (checked at verification time), but voting on an unknown post is rejected before
  // any burn is broadcast.
  bytes target_payload_hash = 1;
  // Raw, signed, RLP-encoded Monad transaction burning value to the same topic-vote burn address
  // as a post's initial vote; its calldata commits to `target_payload_hash` and carries this
  // vote's direction.
  bytes raw_burn_tx = 2;
}

// A [`MonadTopicPost`] as stored by the relay once its initial vote's burn verified, augmented
// with facts the relay itself derived -- mirrors `StoredMonadMessage`.
message StoredMonadTopicPost {
  // The original post as submitted.
  MonadTopicPost post = 1;
  // Sender's 20-byte Monad address, recovered via `ecrecover` from `post.raw_burn_tx`.
  bytes sender_address = 2;
  // 32-byte hash of the broadcast (and confirmed) initial-vote burn transaction.
  bytes tx_hash = 3;
  // Milliseconds since the Unix epoch when the relay stored this post.
  int64 timestamp = 4;
  // Frank-specific network tag (ticket #39, see PLAN.md constraint 9), mirroring
  // `StoredMonadMessage.network_tag` (`monad_message.proto`) exactly -- see that field's doc for
  // the full rationale (short Frank-specific code, not a raw EVM `chainId`, stamped by the relay
  // from its own `FRANK_NETWORK_TAG` configuration). NOTE: field number is `5`, not `6` -- this
  // message only has fields 1-4 defined above (`post`, `sender_address`, `tx_hash`, `timestamp`),
  // so `5` is the actual next-free number here, verified by reading this file rather than assumed
  // from the ticket's issue text (which suggested `6`, off by one for this particular message).
  bytes network_tag = 5;
  // Exact deterministic Frank-CBOR type-9 frame for posts admitted through the CBOR route.
  // Empty for legacy protobuf posts. Keeping the authoritative bytes beside the legacy storage
  // projection preserves the post's T1 identity without rewriting the existing RocksDB layout.
  bytes cbor_post_frame = 6;
}

// A single tallied vote (a post's initial vote, or a later [`MonadTopicVote`]) as stored by the
// relay once its burn verified. Multiple of these can exist per `target_payload_hash`; summing
// their `weight` fields is the post's current vote tally.
message StoredMonadTopicVoteEntry {
  // `payload_hash` of the post this vote counts towards.
  bytes target_payload_hash = 1;
  // Sender's 20-byte Monad address, recovered via `ecrecover` from `raw_burn_tx`.
  bytes sender_address = 2;
  // 32-byte hash of the broadcast (and confirmed) vote burn transaction. Also this entry's
  // dedup key within a target's vote set (see `store::monad_topics::DbMonadTopicVotes`), so retrying an
  // already-verified vote request can't double-count.
  bytes tx_hash = 3;
  // Milliseconds since the Unix epoch when the relay stored this vote.
  int64 timestamp = 4;
  // This vote's signed weight: +value_wei for an up-vote, -value_wei for a down-vote, exactly as
  // burned on-chain (never thresholded against a minimum -- see `monad_topic_verify`'s module
  // docs). Represented as a plain `sint64` rather than an arbitrary-precision type: this repo's
  // Stamp burns are configured in the ~1e12 wei range (`CASHWEB_STAMP_MIN_BURN_VALUE_WEI` in
  // `.env.example`), many orders of magnitude below `i64::MAX` (~9.22e18), so this is a safe
  // simplification for this ticket's scope rather than a real precision limit worth an
  // arbitrary-precision wire type.
  sint64 weight = 5;
}

// Response shape for `GET /message/monad/topics/:payload_hash`: a stored post plus its current
// tallied vote weight (sum of every [`StoredMonadTopicVoteEntry.weight`] recorded against its
// `payload_hash`, including its own initial vote).
message MonadTopicPostView {
  // The stored post itself.
  StoredMonadTopicPost post = 1;
  // Sum of every vote's signed weight recorded against `post.post.payload_hash` (its initial vote
  // plus every later `MonadTopicVote`).
  sint64 vote_weight = 2;
}

// Response shape for `GET /message/monad/topics?topic=<topic>&since=<timestamp>` (ticket #40): a
// topic-filtered page of [`MonadTopicPostView`]s, ordered by `timestamp` ascending. Additive
// proto3 message -- doesn't change any existing message's wire shape.
message MonadTopicPostViews {
  // The matching posts, ordered by `post.post.timestamp` ascending.
  repeated MonadTopicPostView views = 1;
}

// Per-distinct-topic discovery stats (ticket #72), stored in `CF_MONAD_TOPIC_DISCOVERY`. Topics
// stay emergent/tag-based -- there is no separate topic-registration flow and no separate
// anti-spam gate for appearing in this index: a topic post already requires a real burn
// transaction to store (see `monad_topic_verify`'s module docs), so a topic name showing up here
// is already gated by that same cost. See this ticket's design-decision comment on GitHub issue
// #72, and `crate::store::monad_topics`'s module docs for exactly how/when these fields update.
message TopicDiscoveryStats {
  // Total number of posts stored under this topic. Incremented by exactly one per genuinely new
  // `payload_hash` stored under the topic; a retried `put` of an already-stored `payload_hash`
  // does not double-count.
  uint64 post_count = 1;
  // Milliseconds since the Unix epoch of the most recent post stored under this topic (the
  // maximum of every stored post's own `timestamp` for this topic). Never decreases.
  int64 last_activity_ms = 2;
}

// One entry of `ListTopicsResponse` (ticket #72): a discovered topic name paired with its current
// [`TopicDiscoveryStats`], flattened onto a single message for a simpler wire shape than nesting.
message TopicDiscoveryEntry {
  // The topic name itself. Stored/keyed as the raw string (see `crate::store::monad_topics`'s
  // module docs for why this index, unlike `CF_MONAD_TOPIC_POSTS_BY_TOPIC`, doesn't hash it).
  string topic = 1;
  // Same as `TopicDiscoveryStats.post_count`.
  uint64 post_count = 2;
  // Same as `TopicDiscoveryStats.last_activity_ms`.
  int64 last_activity_ms = 3;
}

// Response shape for `GET /message/monad/topics/discover` (ticket #72): every distinct topic name
// this relay has stored at least one post for, ordered by `last_activity_ms` descending. No
// pagination cursor -- see `crate::store::monad_topics::DbMonadTopicPosts::list_topics`'s docs for
// why (small keyspace; add pagination if this ever becomes a real scaling concern).
message ListTopicsResponse {
  // The discovered topics, ordered by `last_activity_ms` descending.
  repeated TopicDiscoveryEntry entries = 1;
}
