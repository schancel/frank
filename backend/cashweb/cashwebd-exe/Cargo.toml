[package]
name = "cashwebd-exe"
version = "0.1.0"
edition = "2021"

[features]
default = []
# The FoundationDB transaction driver (`registry.cluster.driver = "foundationdb"`). It links the
# FoundationDB 7.3 client library (libfdb_c), so a build with it needs that library installed.
foundationdb = ["cashweb-registry/foundationdb", "dep:libc"]

[dependencies]
# `_exit` when the FoundationDB network thread dies (see `watch_fdb_network`).
libc = { version = "0.2", optional = true }
bitcoinsuite-bitcoind = { path = "../../bitcoinsuite/bitcoinsuite-bitcoind" }
bitcoinsuite-core = { path = "../../bitcoinsuite/bitcoinsuite-core" }
bitcoinsuite-error = { path = "../../bitcoinsuite/bitcoinsuite-error" }
cashweb-registry = { path = "../cashweb-registry" }
cashweb-config = { path = "../cashweb-config" }
cashweb-payload = { path = "../cashweb-payload" }

# Web app framework
axum = { version = "0.5", features = ["ws"] }

# Random number generator
rand = "0.8"

# Derive error enums
thiserror = "1.0"

# Async runtime
tokio = { version = "1.17", features = ["full"] }
tracing = "0.1.37"
tracing-subscriber = "0.3.16"

[dev-dependencies]
# Temporary directories, automatically removed
tempdir = "0.3"
tempfile = "3"
# The FoundationDB daemon test signs real group frames and talks HTTP to the relays.
hex = "0.4"
reqwest = { version = "0.11", features = ["json"] }
secp256k1-abc = { git = "https://github.com/raipay/secp256k1-abc" }
serde_json = "1.0"
sha2 = "0.10"
# ... and subscribes to a group's live socket on one replica while another appends.
futures = "0.3"
tokio-tungstenite = "0.17"
# ... and signs a real profile registration, read back across relays.
bitcoinsuite-ecc-secp256k1 = { path = "../../bitcoinsuite/bitcoinsuite-ecc-secp256k1" }
frank-cbor = { path = "../frank-cbor" }
prost = "0.11"
