# checkpoint_block_hash = "0x49d7ec7085e77bf5a403d0fcb4cfc42a4084a89dfff60477579c5e09c9e03c54"
# upstream_ws_env = "TEMPO_MAINNET_WS_RPC_URL"
# max_get_logs_range = 10
#
# [[registry.evm_rpc.chains]]
# id = "tempo-testnet"
# expected_chain_id = 42431
# upstream_env = "TEMPO_TESTNET_HTTP_RPC_URL"
# checkpoint_block_number = 0
# checkpoint_block_hash = "0xba49153e6f3996a340f3fe3d69e7c0826b717ae672cb115cf0527cada0b78e9e"
# upstream_ws_env = "TEMPO_TESTNET_WS_RPC_URL"
# max_get_logs_range = 10

[registry.pop]
enabled = false
monad_rpc_url = "http://unused.invalid"
hmac_secret = "unused-because-pop-is-disabled"
payment_recipient = "0x0000000000000000000000000000000000000000"
min_value_wei = "0"

[registry.bitcoin_proxy]
enabled = true

[[registry.bitcoin_proxy.chains]]
id = "xec-testnet"
chronik_upstream_env = "XEC_TESTNET_CHRONIK_URL"
checkpoint_height = 1421481
checkpoint_hash = "00000000062c7f32591d883c99fc89ebe74a83287c0f2b7ffeef72e62217d40b"

# Electrum is the indexer for Bitcoin-family chains other than eCash. An upstream may be tcp://,
# ssl://, ws:// or wss://; several may be listed in one variable, separated by spaces. Each
# connection must return this checkpoint block before it is used (Bitcoin testnet and Bitcoin Cash
# testnet share a genesis block, so only a block after the fork tells them apart). Dogecoin testnet
# has no row: no public Electrum server for it was reachable on 2026-10-09.
[[registry.bitcoin_proxy.chains]]
id = "btc-testnet"
electrum_upstream_env = "BTC_TESTNET_ELECTRUM_URL"
checkpoint_height = 5125000
checkpoint_hash = "00000000000009ad1946e21cb4f1a6323ee99c89017b59d5166472672b868133"

[[registry.bitcoin_proxy.chains]]
id = "bch-testnet"
electrum_upstream_env = "BCH_TESTNET_ELECTRUM_URL"
checkpoint_height = 1155876
checkpoint_hash = "00000000000e38fef93ed9582a7df43815d5c2ba9fd37ef70c9a0ea4a285b8f5"

[registry.solana_proxy]
enabled = true
anonymous_units_per_hour = 1000000

[[registry.solana_proxy.chains]]
id = "solana-devnet"
upstream_env = "SOLANA_DEVNET_HTTP_RPC_URL"
expected_genesis_hash = "EtWTRABZaYq6iMfeYKouRu166VU2xqa1wcaWoxPkrZBG"

# The price and energy oracle: a background collector and `GET /oracle/v1/feed` (contract:
# docs/protocol/oracle/README.md; operator notes: backend/cashweb/README.md). Clients ask the
# relay and nobody else. Everything below is keyless. Assets and chains are named by their
# mainnet identifier in docs/protocol/chains/v1.json; `non_network_ids` are priced but are not
# Frank networks. Each provider's `symbols` maps an identifier to that provider's own name for it.
# Remove this section and its sub-tables to run a relay without the feed.
[registry.oracle]
non_network_ids = ["ltc-mainnet", "xmr-mainnet", "usdc", "usdt"]

[[registry.oracle.price_providers]]
id = "coinbase"
adapter = "coinbase"
api_url = "https://api.coinbase.com/v2/exchange-rates"
symbols = { btc-mainnet = "BTC", bch-mainnet = "BCH", ltc-mainnet = "LTC", doge-mainnet = "DOGE", ethereum-mainnet = "ETH", solana-mainnet = "SOL", monad-mainnet = "MON", hyperliquid-mainnet = "HYPE", usdc = "USDC", usdt = "USDT" }

[[registry.oracle.price_providers]]
id = "kraken"
adapter = "kraken"
api_url = "https://api.kraken.com/0/public/Ticker"
symbols = { btc-mainnet = "XXBTZUSD", bch-mainnet = "BCHUSD", ltc-mainnet = "XLTCZUSD", doge-mainnet = "XDGUSD", xmr-mainnet = "XXMRZUSD", ethereum-mainnet = "XETHZUSD", solana-mainnet = "SOLUSD", monad-mainnet = "MONUSD", hyperliquid-mainnet = "HYPEUSD", usdc = "USDCUSD", usdt = "USDTZUSD" }

[[registry.oracle.price_providers]]
id = "coingecko"
adapter = "coingecko"
api_url = "https://api.coingecko.com/api/v3/simple/price"
symbols = { btc-mainnet = "bitcoin", bch-mainnet = "bitcoin-cash", xec-mainnet = "ecash", ltc-mainnet = "litecoin", doge-mainnet = "dogecoin", xmr-mainnet = "monero", ethereum-mainnet = "ethereum", solana-mainnet = "solana", monad-mainnet = "monad", hyperliquid-mainnet = "hyperliquid", usdc = "usd-coin", usdt = "tether" }

# binance.com answers 451 from the United States; a relay there leaves it resting and uses
# Binance.US. Binance.US has no traded eCash market, so it lists none.
[[registry.oracle.price_providers]]
id = "binance"
adapter = "binance"
api_url = "https://api.binance.com/api/v3/ticker/price"
symbols = { btc-mainnet = "BTCUSDT", bch-mainnet = "BCHUSDT", xec-mainnet = "XECUSDT", ltc-mainnet = "LTCUSDT", doge-mainnet = "DOGEUSDT", ethereum-mainnet = "ETHUSDT", solana-mainnet = "SOLUSDT" }

[[registry.oracle.price_providers]]
id = "binance-us"
adapter = "binance"
api_url = "https://api.binance.us/api/v3/ticker/price"
symbols = { btc-mainnet = "BTCUSDT", bch-mainnet = "BCHUSDT", ltc-mainnet = "LTCUSDT", doge-mainnet = "DOGEUSDT", ethereum-mainnet = "ETHUSDT", solana-mainnet = "SOLUSDT" }

# Chainlink USD feeds on Arbitrum One, read over its public JSON-RPC endpoint. A symbol is the
# feed contract's address.
[[registry.oracle.price_providers]]
id = "chainlink"
adapter = "chainlink"
api_url = "https://arb1.arbitrum.io/rpc"
symbols = { btc-mainnet = "0x6ce185860a4963106506C203335A2910413708e9", ethereum-mainnet = "0x639Fe6ab55C921f74e7fac1ee960C0B6293ba612" }

# Difficulty, coins in existence and block subsidy of the mined chains: one request an hour.
[registry.oracle.chain_stats]
id = "blockchair"
api_url = "https://api.blockchair.com/stats"

[registry.oracle.chain_stats.chains]
btc-mainnet = { name = "bitcoin", decimals = 8 }
bch-mainnet = { name = "bitcoin-cash", decimals = 8 }
# eCash consensus pays the miner 58% of the subsidy (32% miner fund, 10% staking reward).
xec-mainnet = { name = "ecash", decimals = 2, miner_share = "0.58" }
ltc-mainnet = { name = "litecoin", decimals = 8 }
doge-mainnet = { name = "dogecoin", decimals = 8 }
xmr-mainnet = { name = "monero", decimals = 12 }

# Wholesale day-ahead electricity, one request a day per region plus one for the euro rates.
[[registry.oracle.electricity]]
region = "de-lu"
label = "Germany-Luxembourg day-ahead auction, all hours"
attribution = "Bundesnetzagentur | SMARD.de via Fraunhofer ISE Energy-Charts, CC BY 4.0; euro reference rates: European Central Bank"
adapter = "energy-charts"
api_url = "https://api.energy-charts.info/price"
zone = "DE-LU"
fx_url = "https://www.ecb.europa.eu/stats/eurofxref/eurofxref-hist-90d.xml"
