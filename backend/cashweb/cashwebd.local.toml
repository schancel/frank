# Persistent Monad-first development server. Paths are relative to backend/cashweb, where the
# documented command is run. Omit [bitcoin_rpc] to keep legacy Lotus routes disabled.
host = "127.0.0.1:8098"
url = "http://127.0.0.1:8098"

[registry]
db_path = "data/registry.rocksdb"
net = "mainnet"
peers = []
public_relay_urls = []

# The account directory. The message, directory and relay-info routes (`/message*`,
# `/directory/v1/*`, `/relay/v1/info`) exist only when this section is present: without it nobody
# can register on or message through this relay. `network` is the registry id of the chain the
# mailbox above serves; `endpoint` is the origin clients reach this relay at (run-local-monad.sh
# keeps both in step with FRANK_NETWORK_TAG, FRANK_RELAY_LISTEN and FRANK_RELAY_PUBLIC_URL).
# `relay_id` and `relay_identity` only name this relay in directory entries; the relay holds no
# key for them and signs nothing. These are well-known development values: give a deployed relay
# its own. No sign-up limit for local development and the demo.
[registry.directory]
network = "monad-testnet"
relay_id = "0102030405060708090a0b0c0d0e0f10"
relay_identity = "0279be667ef9dcbbac55a06295ce870b07029bfcdb2dce28d959f2815b16f81798"
endpoint = "http://127.0.0.1:8098"
binding_expiry_ns = "1893456000000000000"
enrollments_per_source_per_hour = 100000

# The RPC URL is deliberately NOT in this file: `cashwebd-exe` reads it from the
# MONAD_TESTNET_HTTP_RPC_URL environment variable (and refuses to start with a clear message when
# it is missing), and requires FRANK_NETWORK_TAG (MONT on Monad testnet) to be set too.
# An explicit `rpc_url = "..."` here would take precedence over the environment.
# 10143 is Monad testnet's chain ID (mainnet is 143); 1000000000000 wei = 0.000001 MON.
[registry.monad_mailbox]
enabled = true
min_value_wei = "1000000000000"
expected_chain_id = 10143

# One EVM-family handler serves chain rows as data. The provider URL remains server-only in the
# named environment variable and is chain-id checked before the relay becomes ready.
[registry.evm_rpc]
enabled = true
capability_ttl_ms = 3600000
anonymous_units_per_hour = 1000000

[[registry.evm_rpc.chains]]
id = "monad-testnet"
expected_chain_id = 10143
upstream_env = "MONAD_TESTNET_HTTP_RPC_URL"
checkpoint_block_number = 0
checkpoint_block_hash = "0x298034669ee44327d2da9744b9b2782848e2f2a6959756b7b0471b09a404f5c9"
# Optional at runtime: an unset/empty value leaves WebSockets disabled.
upstream_ws_env = "MONAD_TESTNET_WS_RPC_URL"
max_get_logs_range = 10

# Reference configurations for Hyperliquid and Tempo RPC forwarding:
# To enable forwarding for either network, set the corresponding upstream URL in .env and uncomment:
#
# [[registry.evm_rpc.chains]]
# id = "hyperliquid-mainnet"
# expected_chain_id = 999
# upstream_env = "HYPERLIQUID_MAINNET_HTTP_RPC_URL"
# checkpoint_block_number = 1
# checkpoint_block_hash = "0xde151843548b88d06f201d86e860e45fbf07d49612f1934fba5746abd942fb01"
# upstream_ws_env = "HYPERLIQUID_MAINNET_WS_RPC_URL"
# max_get_logs_range = 10
#
# [[registry.evm_rpc.chains]]
# id = "hyperliquid-testnet"
# expected_chain_id = 998
# upstream_env = "HYPERLIQUID_TESTNET_HTTP_RPC_URL"
# checkpoint_block_number = 50000000
# checkpoint_block_hash = "0x61826beeba5fa2a5cc2dcd04febc904aca943cb95821eab8087308cfa25b2baf"
# upstream_ws_env = "HYPERLIQUID_TESTNET_WS_RPC_URL"
# max_get_logs_range = 10
