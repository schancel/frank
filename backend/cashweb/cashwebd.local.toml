# Persistent Monad-first development server. Paths are relative to backend/cashweb, where the
# documented command is run. Omit [bitcoin_rpc] to keep legacy Lotus routes disabled.
host = "127.0.0.1:8098"
url = "http://127.0.0.1:8098"

[registry]
db_path = "data/registry.rocksdb"
net = "mainnet"
peers = []
public_relay_urls = []

# The RPC URL is deliberately NOT in this file: `cashwebd-exe` reads it from the
# MONAD_TESTNET_HTTP_RPC_URL environment variable (and refuses to start with a clear message when
# it is missing), and requires FRANK_NETWORK_TAG (MONT on Monad testnet) to be set too.
# An explicit `rpc_url = "..."` here would take precedence over the environment.
# 10143 is Monad testnet's chain ID (mainnet is 143); 1000000000000 wei = 0.000001 MON.
[registry.monad_mailbox]
enabled = true
min_value_wei = "1000000000000"
expected_chain_id = 10143

# One EVM-family handler serves chain rows as data. The provider URL remains server-only in the
# named environment variable and is chain-id checked before the relay becomes ready.
[registry.evm_rpc]
enabled = true
capability_ttl_ms = 3600000

[[registry.evm_rpc.chains]]
id = "monad-testnet"
expected_chain_id = 10143
upstream_env = "MONAD_TESTNET_HTTP_RPC_URL"
checkpoint_block_number = 0
checkpoint_block_hash = "0x298034669ee44327d2da9744b9b2782848e2f2a6959756b7b0471b09a404f5c9"
# Optional at runtime: an unset/empty value leaves WebSockets disabled.
upstream_ws_env = "MONAD_TESTNET_WS_RPC_URL"
max_get_logs_range = 10

[registry.pop]
enabled = false
monad_rpc_url = "http://unused.invalid"
hmac_secret = "unused-because-pop-is-disabled"
payment_recipient = "0x0000000000000000000000000000000000000000"
min_value_wei = "0"

[registry.bitcoin_proxy]
enabled = true

[[registry.bitcoin_proxy.chains]]
id = "xec-testnet"
chronik_upstream_env = "XEC_TESTNET_CHRONIK_URL"
checkpoint_height = 1421481
checkpoint_hash = "00000000062c7f32591d883c99fc89ebe74a83287c0f2b7ffeef72e62217d40b"

