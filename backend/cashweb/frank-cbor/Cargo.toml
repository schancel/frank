[package]
name = "frank-cbor"
version = "0.1.0"
edition = "2021"
description = "Version-1 Frank-CBOR frames and restricted canonical CBOR"
license = "MIT"
publish = false

[dependencies]
# Point parsing for the type-5 stamp fields (README T3b). Already the workspace curve library.
secp256k1-abc = { git = "https://github.com/raipay/secp256k1-abc" }
sha2 = "=0.10.5"
thiserror = "=1.0.35"

[dev-dependencies]
hex = "=0.4.3"
serde = { version = "=1.0.147", features = ["derive"] }
serde_json = "=1.0.85"
