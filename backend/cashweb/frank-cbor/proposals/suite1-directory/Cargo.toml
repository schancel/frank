[package]
name = "suite1-directory-proposal-check"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone, opt-in harness: never an active cashweb workspace member.
[workspace]

[dependencies]
frank-cbor = { path = "../.." }
sha2 = "=0.10.5"
hex = "=0.4.3"
serde_json = "=1.0.85"
secp256k1-abc = { git = "https://github.com/raipay/secp256k1-abc" }

[[bin]]
name = "check"
path = "check.rs"
