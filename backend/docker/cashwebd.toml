# Static docker-compose config for `cashwebd-exe` (see ../Dockerfile). This file deliberately
# holds no real secrets and needs no templating at container-start time.
#
# The durable Monad direct-message mailbox (`PUT /message/monad` and the authenticated inbox and
# recovery routes) is enabled by default, configured by `[registry.monad_mailbox]` below. The
# Monad JSON-RPC URL is secret-bearing and so is NOT stored here: `cashwebd-exe` reads it from
# `MONAD_TESTNET_HTTP_RPC_URL` (docker-compose.yml passes it through) and exits at startup with a
# clear message when it is missing. `FRANK_NETWORK_TAG` (compose defaults it to MONT) must also be
# set or the daemon refuses to start. An explicit `rpc_url` key here would override the
# environment. 10143 is Monad testnet's chain ID (mainnet is 143, tag MON1). Set `enabled =
# false` to roll back to a relay that 404s every `/message/monad` route except the topic routes.
# The topic routes read `MONAD_TESTNET_HTTP_RPC_URL`/`MONAD_STAMP_BURN_ADDRESS` from the
# environment as well.
#
# `[bitcoin_rpc]` is deliberately omitted: `cashwebd-exe` installs a fail-closed adapter for
# legacy Lotus routes while continuing to serve Monad routes. Add real Lotus RPC credentials to
# enable compatibility; a fake endpoint is no longer necessary. `[registry.pop]`'s sub-fields
# (`monad_rpc_url`/`hmac_secret`/
# `payment_recipient`/`min_value_wei`) are required by `PopConf`'s schema even though `enabled =
# false` skips the gate entirely (ticket #35's fail-open demo default) -- see that struct's own doc
# comment for why `enabled` has no `#[serde(default)]`.

host = "0.0.0.0:8080"
url = "http://localhost:8080"

[registry]
db_path = "/data/registry.rocksdb"
net = "mainnet"
peers = []
public_relay_urls = []

# The account directory. The message, directory and relay-info routes (`/message*`,
# `/directory/v1/*`, `/relay/v1/info`) exist only when this section is present: without it nobody
# can register on or message through this relay. `network` is the registry id of the chain the
# mailbox below serves. `endpoint` is the origin clients reach this relay at: change it together
# with `url` above when the relay is published under another name. `relay_id` and
# `relay_identity` only name this relay in directory entries; the relay holds no key for them and
# signs nothing. These are well-known development values: give a deployed relay its own.
[registry.directory]
network = "monad-testnet"
relay_id = "0102030405060708090a0b0c0d0e0f10"
relay_identity = "0279be667ef9dcbbac55a06295ce870b07029bfcdb2dce28d959f2815b16f81798"
endpoint = "http://localhost:8080"
binding_expiry_ns = "1893456000000000000"
enrollments_per_source_per_hour = 100000

[registry.monad_mailbox]
enabled = true
min_value_wei = "1000000000000"
expected_chain_id = 10143

[registry.evm_rpc]
enabled = true
capability_ttl_ms = 3600000

[[registry.evm_rpc.chains]]
id = "monad-testnet"
expected_chain_id = 10143
upstream_env = "MONAD_TESTNET_HTTP_RPC_URL"
checkpoint_block_number = 0
checkpoint_block_hash = "0x298034669ee44327d2da9744b9b2782848e2f2a6959756b7b0471b09a404f5c9"
# Optional at runtime: an unset/empty value leaves WebSockets disabled.
upstream_ws_env = "MONAD_TESTNET_WS_RPC_URL"
max_get_logs_range = 10

# Reference configurations for Hyperliquid and Tempo RPC forwarding:
# To enable forwarding for either network, set the corresponding upstream URL in .env and uncomment:
