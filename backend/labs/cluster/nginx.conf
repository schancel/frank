# Round-robin over the three lab relays, so the app can use one origin (127.0.0.1:18080).
events {}
http {
    # Re-resolve relay names, so a restarted relay with a new address is found again.
    resolver 127.0.0.11 valid=5s ipv6=off;
    upstream relays {
        zone relays 64k;
        server relay-a:8080 resolve;
        server relay-b:8080 resolve;
        server relay-c:8080 resolve;
    }
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
    server {
        listen 8080;
        client_max_body_size 16m;
        location / {
            proxy_pass http://relays;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
            proxy_next_upstream error timeout;
        }
    }
}
