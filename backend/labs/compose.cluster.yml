# Disposable three-relay cluster lab: FoundationDB, Core NATS, MinIO, relay-a/b/c and a
# round-robin proxy. Every published port binds to 127.0.0.1. See README.md for the commands.
name: frank-lab-cluster

x-relay: &relay
  # The lab bucket's synthetic credentials (see minio); nothing here is a real secret.
  environment:
    FRANK_S3_ACCESS_KEY_ID: frank-lab
    FRANK_S3_SECRET_ACCESS_KEY: frank-lab-disposable-secret
  build:
    context: ../..
    dockerfile: backend/labs/Dockerfile.cluster
    target: relay
  networks: [cluster]
  depends_on:
    fdb-init:
      condition: service_completed_successfully
    secrets-init:
      condition: service_completed_successfully
    minio-init:
      condition: service_completed_successfully
    nats:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:8080/chains"]
    interval: 2s
    timeout: 2s
    retries: 60

services:
  fdb:
    image: foundationdb/foundationdb:7.3.63
    environment:
      FDB_NETWORKING_MODE: container
      FDB_CLUSTER_FILE: /cluster/fdb.cluster
      FDB_PORT: "4500"
    volumes:
      - fdb-data:/var/fdb/data
      - fdb-cluster:/cluster
    # The cluster file names the coordinator by address, so the address is fixed: a restart
    # (the contract restarts FDB mid-load) must come back at the same one.
    networks:
      cluster:
        ipv4_address: 10.89.42.10
    healthcheck:
      test: ["CMD-SHELL", "fdbcli -C /cluster/fdb.cluster --timeout 5 --exec 'status minimal' | grep -F 'The database is available.'"]
      interval: 3s
      timeout: 6s
      retries: 40

  # One-shot: create the single-node database on first start; a no-op once it exists.
  fdb-init:
    image: foundationdb/foundationdb:7.3.63
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for attempt in $$(seq 1 60); do
          if [ -s /cluster/fdb.cluster ]; then
            status=$$(fdbcli -C /cluster/fdb.cluster --timeout 5 --exec 'status minimal' 2>&1)
            case "$$status" in
              *"The database is available."*) echo "FoundationDB is available"; exit 0 ;;
            esac
            fdbcli -C /cluster/fdb.cluster --timeout 10 --exec 'configure new single ssd' || true
          fi
          sleep 1
        done
        echo "FoundationDB did not become available" >&2
        exit 1
    volumes:
      - fdb-cluster:/cluster
    networks: [cluster]
    depends_on:
      fdb:
        condition: service_started

  nats:
    image: nats:2.10-alpine
    command: ["-m", "8222"]
    networks: [cluster]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30

  minio:
    build:
      context: .
      dockerfile: Dockerfile.minio
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: frank-lab
      MINIO_ROOT_PASSWORD: frank-lab-disposable-secret
    volumes:
      - minio-data:/data
    networks: [cluster]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 2s
      timeout: 2s
      retries: 30

  # One-shot: create the lab bucket with one SigV4 request (no MinIO client image exists).
  minio-init:
    build:
      context: .
      dockerfile: Dockerfile.minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        bucket=http://minio:9000/frank-lab-blobs
        auth="--user frank-lab:frank-lab-disposable-secret --aws-sigv4 aws:amz:us-east-1:s3"
        if curl --fail --silent --output /dev/null $$auth --head "$$bucket"; then
          echo "bucket exists"
        else
          curl --fail --silent --show-error $$auth --request PUT "$$bucket"
          echo "bucket created"
        fi
    networks: [cluster]
    depends_on:
      minio:
        condition: service_healthy

  # One-shot: the lab's operator-provisioned session secret and VAPID key, written once into a
  # shared volume and never on the host. Real deployments provision these files themselves.
  secrets-init:
    image: nats:2.10-alpine
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        [ -s /secrets/session-secret ] || head -c 32 /dev/urandom > /secrets/session-secret
        [ -s /secrets/vapid-private-key ] || od -An -tx1 -N32 /dev/urandom | tr -d ' \n' > /secrets/vapid-private-key
        chmod 0400 /secrets/session-secret /secrets/vapid-private-key
        echo "provisioned secrets present"
    volumes:
      - secrets:/secrets
    networks: [cluster]

  relay-a:
    <<: *relay
    volumes:
      - ./cluster/relay.toml:/etc/cashwebd/cashwebd.toml:ro
      - fdb-cluster:/cluster:ro
      - secrets:/secrets:ro
      - relay-a-data:/data
  relay-b:
    <<: *relay
    volumes:
      - ./cluster/relay.toml:/etc/cashwebd/cashwebd.toml:ro
      - fdb-cluster:/cluster:ro
      - secrets:/secrets:ro
      - relay-b-data:/data
  relay-c:
    <<: *relay
    volumes:
      - ./cluster/relay.toml:/etc/cashwebd/cashwebd.toml:ro
      - fdb-cluster:/cluster:ro
      - secrets:/secrets:ro
      - relay-c-data:/data

  proxy:
    image: nginx:1.29-alpine
    volumes:
      - ./cluster/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:${FRANK_LAB_CLUSTER_PORT:-18080}:8080"
    networks: [cluster]
    depends_on:
      relay-a:
        condition: service_healthy
      relay-b:
        condition: service_healthy
      relay-c:
        condition: service_healthy

  # HTTP contract against all three relays. Its fault cases stop and start this project's
  # containers through the Docker socket, so it is a test profile only.
  cluster-contract:
    profiles: ["cluster-contract"]
    build:
      context: ../..
      dockerfile: backend/labs/Dockerfile.cluster
      target: contract
    environment:
      FRANK_CLUSTER_RELAYS: http://relay-a:8080,http://relay-b:8080,http://relay-c:8080
      FRANK_CLUSTER_PROXY: http://proxy:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [cluster]
    depends_on:
      proxy:
        condition: service_started

networks:
  cluster:
    ipam:
      config:
        - subnet: 10.89.42.0/24

volumes:
  fdb-data:
  fdb-cluster:
  minio-data:
  secrets:
  relay-a-data:
  relay-b-data:
  relay-c-data:
