// Copy of backend/cashweb/cashweb-registry/proto/monad_message.proto (ticket #27) — kept in sync
// by hand, matching this app's existing convention of a local proto/ source per feature area
// rather than a cross-repo build-time reference. If this drifts from the backend's copy, the
// backend's is authoritative (it's what the live relay actually decodes against).
syntax = "proto3";
package cashweb.registry;

// A Monad-native stamped broadcast message (ticket #27).
//
// The Lotus `SignedPayload`/`BurnTx` scheme (`cashweb-payload/proto/payload.proto`) is
// structurally UTXO-shaped -- `BurnTx.burn_idx` indexes into a Bitcoin-style transaction's output
// list, which has no EVM equivalent -- so a Monad stamp can't be carried through it. This message
// is a separate, simpler envelope for the Monad path instead (see this ticket's module docs for
// the full rationale, and PLAN.md constraint 5).
//
// Unlike `SignedPayload`, there is deliberately no separate pubkey/signature field: the sender's
// identity is recovered via `ecrecover` from `raw_burn_tx`'s own ECDSA signature (see
// `cashweb_registry::monad_evm_tx::recover_sender`), and the binding between this specific
// `encrypted_payload` and the on-chain burn is `payload_hash`, which `raw_burn_tx`'s calldata must
// commit to (checked via `cashweb_registry::monad_stamp_verify::parse_commitment_calldata`) --
// there is no Lotus-style `SHA256(SHA256(pubkey) || payload_hash)` preimage, since there's no
// separate pubkey to bind against.
message MonadStampedMessage {
  // Raw, signed, RLP-encoded Monad (EVM-style) transaction burning value to the relay's configured
  // stamp address, whose calldata commits to `payload_hash`. The relay itself broadcasts this tx
  // (see `monad_stamp_relay::broadcast_and_verify_stamp`) -- the client is never required to have
  // already landed it on-chain.
  bytes raw_burn_tx = 1;
  // The message payload, encrypted for its recipient(s). Opaque to the relay.
  bytes encrypted_payload = 2;
  // SHA256(encrypted_payload). Must match both the actual hash of `encrypted_payload` and the
  // commitment carried in `raw_burn_tx`'s calldata.
  bytes payload_hash = 3;
}

// A [`MonadStampedMessage`] as stored by the relay once its stamp verified, augmented with facts
// the relay itself derived (and that the client doesn't, and for the sender address cannot
// meaningfully, assert).
message StoredMonadMessage {
  // The original message as submitted.
  MonadStampedMessage message = 1;
  // Sender's 20-byte Monad address, recovered via `ecrecover` from `message.raw_burn_tx`'s own
  // signature -- never asserted by the client.
  bytes sender_address = 2;
  // 32-byte hash of the broadcast (and confirmed) burn transaction.
  bytes tx_hash = 3;
  // Milliseconds since the Unix epoch when the relay stored this message.
  int64 timestamp = 4;
  // Frank-specific network tag (ticket #39, see PLAN.md constraint 9, and
  // `cashweb_registry::network_tag` for the backend's tag constants, e.g. `"MONT"`/`"MON1"`),
  // stamped by the relay from its own `FRANK_NETWORK_TAG` configuration -- never asserted by the
  // client, and never a raw EVM `chainId` (Lotus and any future non-EVM `ChainAdapter` have no such
  // concept). Lets a client detect "the relay I'm talking to is on a different network than I
  // expect" once one relay deployment could plausibly serve multiple chains -- out of scope for
  // this ticket is any actual mismatch-checking logic client-side, this field just needs to exist,
  // be populated, and be decodable. Empty (proto3 default) on records stored before this ticket
  // shipped -- not backfilled, and expected to decode fine as empty bytes.
  bytes network_tag = 5;
}

// Response for `GET /message/monad?since=<timestamp>` (ticket #37): a page of
// [`StoredMonadMessage`]s the relay has stored, ordered by `timestamp` ascending, letting a
// client discover newly-stored messages without already knowing their `payload_hash` out of
// band.
//
// NOTE on recipient addressing (see ticket #37's handoff for the full writeup): neither
// `MonadStampedMessage` nor `StoredMonadMessage` carries an intended-recipient field -- a Monad
// message is addressed purely by content hash, with `encrypted_payload` opaque to the relay.
// This endpoint therefore cannot filter server-side by recipient (unlike the polling endpoint
// shape ticket #37 sketches, `GET /message/monad?since=<timestamp>&recipient=<address>`) --
// there is nothing in the wire format for the relay to filter *on*. A client must currently
// fetch this "since" page and determine which (if any) messages are addressed to it itself
// (e.g. by trial decryption), mirroring how `DbTopics`'s existing topic-broadcast model already
// works for the Lotus path (subscribers to a topic fetch everything and decrypt client-side).
// Adding real recipient filtering would need a new field on `MonadStampedMessage` (additive --
// e.g. `bytes recipient_address_hint = 4`, proto3 field addition is backward-compatible) but
// that's a wire-format decision left for deliberate review since #16/#19/#27/#30 all build on
// this proto -- not made unilaterally here.
//
// Not yet mirrored into `monad_message_pb.js`/`.d.ts` (this app-side proto copy's generated
// output) since the app doesn't consume this endpoint yet -- regenerate those when it does.
message StoredMonadMessages {
  // Matching messages, ordered by `timestamp` ascending.
  repeated StoredMonadMessage messages = 1;
}
