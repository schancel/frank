[package]
name = "frank-experimental-solana-crypto-backend"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
path = "lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
curve25519-dalek = { version = "=4.1.3", features = ["zeroize"] }
ed25519-dalek = { version = "=2.2.0", features = ["hazmat", "zeroize"] }
hmac = "=0.12.1"
serde_json = "=1.0.151"
sha2 = "=0.10.9"
zeroize = "=1.9.1"
serde = { version = "=1.0.229", features = ["derive"] }
wasm-bindgen = "=0.2.129"
